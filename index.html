<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#f3f4f8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<meta name="description" content="Mapa de sala para aplicação de provas: advertências, chamada, entregas, banheiro, cronômetro e relatório.">
<title>Mapa de Prova</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%234f46e5'/%3E%3Cstop offset='1' stop-color='%238b5cf6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Crect x='12' y='13' width='17' height='15' rx='4' fill='%23fff'/%3E%3Crect x='35' y='13' width='17' height='15' rx='4' fill='%23fff' opacity='.6'/%3E%3Crect x='12' y='35' width='17' height='15' rx='4' fill='%23fff' opacity='.6'/%3E%3Crect x='35' y='35' width='17' height='15' rx='4' fill='%23fbbf24'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..900&display=swap" rel="stylesheet">
<style>
/* ============================================================
   TOKENS
   ============================================================ */
:root{
  color-scheme:light;
  --bg:#f3f4f8; --map:#eceef4; --dot:rgba(40,52,90,.14);
  --surface:#ffffff; --surface-2:#f6f7fb; --surface-3:#eceef5; --glass:rgba(255,255,255,.84);
  --line:#e2e5ee; --line-2:#cfd4e1;
  --text:#121829; --text-2:#454e66; --muted:#7a8299;
  --accent:#4f46e5; --accent-soft:#eef0ff; --on-accent:#ffffff;
  --w1:#d97706; --w1-soft:#fff6e0; --w1-line:#f5d283;
  --w2:#ea580c; --w2-soft:#ffeddf; --w2-line:#fbbf8f;
  --w3:#e11d48; --w3-soft:#ffe8ee; --w3-line:#fca5b9;
  --ok:#15803d; --ok-soft:#e6f7ec; --ok-line:#98ddb0;
  --wc:#0e7490; --wc-soft:#e1f5fa; --wc-line:#8fd6e8;
  --danger:#e11d48; --danger-soft:#fff0f3;
  --on-strong:#ffffff;
  --seat:#ffffff; --seat-line:#dce0ea; --seat-num:#8b93a7;
  --m-view:var(--accent); --m-warn:var(--w2); --m-presence:#7c3aed; --m-done:var(--ok); --m-wc:var(--wc); --m-edit:#475569;
  --tm-s1:88%; --tm-l1:93%; --tm-s2:62%; --tm-l2:31%; --tm-s3:62%; --tm-l3:78%;
  --sh-1:0 1px 2px rgba(18,24,41,.05),0 2px 6px rgba(18,24,41,.06);
  --sh-2:0 10px 28px rgba(18,24,41,.13),0 2px 6px rgba(18,24,41,.05);
  --sh-3:0 24px 64px rgba(18,24,41,.24);
  --font:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --mode-c:var(--m-view);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0c0f16; --map:#090c12; --dot:rgba(160,175,215,.11);
    --surface:#151924; --surface-2:#1a1f2c; --surface-3:#232938; --glass:rgba(21,25,36,.84);
    --line:#252b3a; --line-2:#363e52;
    --text:#e9ecf5; --text-2:#b3bacb; --muted:#80889d;
    --accent:#8b93ff; --accent-soft:rgba(139,147,255,.15); --on-accent:#0c0f16;
    --w1:#fbbf24; --w1-soft:rgba(251,191,36,.12); --w1-line:rgba(251,191,36,.38);
    --w2:#fb923c; --w2-soft:rgba(251,146,60,.13); --w2-line:rgba(251,146,60,.4);
    --w3:#fb7185; --w3-soft:rgba(251,113,133,.13); --w3-line:rgba(251,113,133,.42);
    --ok:#4ade80; --ok-soft:rgba(74,222,128,.12); --ok-line:rgba(74,222,128,.36);
    --wc:#22d3ee; --wc-soft:rgba(34,211,238,.12); --wc-line:rgba(34,211,238,.38);
    --danger:#fb7185; --danger-soft:rgba(251,113,133,.12);
    --on-strong:#0c0f16;
    --seat:#171c28; --seat-line:#2a3142; --seat-num:#7d869c;
    --m-presence:#a78bfa; --m-edit:#94a3b8;
    --tm-s1:42%; --tm-l1:21%; --tm-s2:90%; --tm-l2:80%; --tm-s3:50%; --tm-l3:36%;
    --sh-1:0 1px 2px rgba(0,0,0,.3),0 2px 8px rgba(0,0,0,.25);
    --sh-2:0 12px 30px rgba(0,0,0,.45);
    --sh-3:0 24px 64px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0c0f16; --map:#090c12; --dot:rgba(160,175,215,.11);
  --surface:#151924; --surface-2:#1a1f2c; --surface-3:#232938; --glass:rgba(21,25,36,.84);
  --line:#252b3a; --line-2:#363e52;
  --text:#e9ecf5; --text-2:#b3bacb; --muted:#80889d;
  --accent:#8b93ff; --accent-soft:rgba(139,147,255,.15); --on-accent:#0c0f16;
  --w1:#fbbf24; --w1-soft:rgba(251,191,36,.12); --w1-line:rgba(251,191,36,.38);
  --w2:#fb923c; --w2-soft:rgba(251,146,60,.13); --w2-line:rgba(251,146,60,.4);
  --w3:#fb7185; --w3-soft:rgba(251,113,133,.13); --w3-line:rgba(251,113,133,.42);
  --ok:#4ade80; --ok-soft:rgba(74,222,128,.12); --ok-line:rgba(74,222,128,.36);
  --wc:#22d3ee; --wc-soft:rgba(34,211,238,.12); --wc-line:rgba(34,211,238,.38);
  --danger:#fb7185; --danger-soft:rgba(251,113,133,.12);
  --on-strong:#0c0f16;
  --seat:#171c28; --seat-line:#2a3142; --seat-num:#7d869c;
  --m-presence:#a78bfa; --m-edit:#94a3b8;
  --tm-s1:42%; --tm-l1:21%; --tm-s2:90%; --tm-l2:80%; --tm-s3:50%; --tm-l3:36%;
  --sh-1:0 1px 2px rgba(0,0,0,.3),0 2px 8px rgba(0,0,0,.25);
  --sh-2:0 12px 30px rgba(0,0,0,.45);
  --sh-3:0 24px 64px rgba(0,0,0,.6);
}

/* ============================================================
   BASE
   ============================================================ */
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--font);font-feature-settings:"cv11","ss01";-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-user-select:none;user-select:none}
button:disabled{cursor:default}
:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 45%,transparent);outline-offset:2px}
.i{width:20px;height:20px;flex:none;display:block}
[hidden]{display:none!important}
.app{position:fixed;inset:0;display:flex;flex-direction:column}
.app[data-mode="view"]{--mode-c:var(--m-view)}
.app[data-mode="warn"]{--mode-c:var(--m-warn)}
.app[data-mode="presence"]{--mode-c:var(--m-presence)}
.app[data-mode="done"]{--mode-c:var(--m-done)}
.app[data-mode="wc"]{--mode-c:var(--m-wc)}
.app[data-mode="edit"]{--mode-c:var(--m-edit)}
.tnum{font-variant-numeric:tabular-nums}

/* ============================================================
   HEADER
   ============================================================ */
.top{position:relative;z-index:20;padding-top:calc(8px + var(--sat));background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border-bottom:1px solid var(--line)}
.app.focus .top{display:none}
.top-row{display:flex;align-items:center;gap:8px;padding:0 10px}
.brand{display:flex;align-items:center;gap:9px;flex:none;font-weight:850;letter-spacing:-.025em;font-size:15.5px}
.logo{width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,#4f46e5,#8b5cf6);display:grid;place-items:center;box-shadow:0 6px 16px rgba(79,70,229,.32)}
.brand-name{display:none;white-space:nowrap}
@media (min-width:900px){.brand-name{display:block}.top-row{padding:0 14px}}
.tabs{flex:1;min-width:0;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;height:36px;display:inline-flex;align-items:center;gap:7px;padding:0 13px;border-radius:11px;border:1px solid var(--line);background:var(--surface);color:var(--text-2);font-size:13px;font-weight:750;white-space:nowrap;transition:background .15s,color .15s,border-color .15s,transform .1s}
.tab:active{transform:scale(.96)}
.tab.on{background:var(--text);border-color:var(--text);color:var(--bg)}
.tab .i{width:14px;height:14px;opacity:.7}
.tab-b{min-width:19px;height:19px;border-radius:10px;padding:0 5px;font-size:10.5px;font-weight:850;display:inline-grid;place-items:center;background:var(--w2);color:#fff}
.tab-dot{width:8px;height:8px;border-radius:50%;background:var(--wc);box-shadow:0 0 0 2px var(--surface)}
.tab.on .tab-dot{box-shadow:0 0 0 2px var(--text)}
.tab.add{width:36px;padding:0;justify-content:center}
.top-actions{display:flex;gap:6px;flex:none}
.iconbtn{width:38px;height:38px;flex:none;border-radius:11px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--text-2);transition:transform .1s,background .15s,opacity .15s}
.iconbtn:active:not(:disabled){transform:scale(.92);background:var(--surface-3)}
.iconbtn:disabled{opacity:.35}
.iconbtn.sm{width:34px;height:34px;border-radius:10px}
.iconbtn.sm .i{width:18px;height:18px}
.iconbtn.ghost{border-color:transparent;background:transparent}
@media (max-width:520px){.hide-sm{display:none}}
@media (hover:hover){.iconbtn:hover:not(:disabled),.tab:hover:not(.on){background:var(--surface-2)}}

.stats{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:8px 10px 9px}
.stats::-webkit-scrollbar{display:none}
@media (min-width:900px){.stats{padding:9px 14px 10px}}
.stat{flex:none;position:relative;height:34px;display:inline-flex;align-items:center;gap:7px;padding:0 11px;border-radius:11px;border:1px solid var(--line);background:var(--surface);font-size:12.5px;font-weight:700;color:var(--text-2);white-space:nowrap;transition:transform .1s,background .2s}
.stat:active{transform:scale(.96)}
.stat .i{width:16px;height:16px}
.stat b{font-weight:850;color:var(--text);font-variant-numeric:tabular-nums}
.stat em{font-style:normal;font-size:11px;font-weight:800;padding:2px 7px;border-radius:99px;background:var(--surface-3);color:var(--text-2)}
.stat em.bad{background:var(--w3-soft);color:var(--w3)}
.stat.exam.idle{background:var(--accent);border-color:transparent;color:var(--on-accent)}
.stat.exam.run{border-color:color-mix(in srgb,var(--accent) 35%,var(--line));background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 16%,var(--surface)) var(--p,0%),var(--surface) var(--p,0%))}
.stat.exam.run b{color:var(--accent);font-size:13.5px}
.stat.exam.run .i{color:var(--accent)}
.stat.exam.amber{background:linear-gradient(90deg,color-mix(in srgb,var(--w1) 20%,var(--surface)) var(--p,0%),var(--surface) var(--p,0%));border-color:var(--w1-line)}
.stat.exam.amber b,.stat.exam.amber .i{color:var(--w1)}
.stat.exam.red{background:linear-gradient(90deg,color-mix(in srgb,var(--w3) 20%,var(--surface)) var(--p,0%),var(--surface) var(--p,0%));border-color:var(--w3-line)}
.stat.exam.red b,.stat.exam.red .i{color:var(--w3)}
.stat.exam.over{background:var(--w3);border-color:transparent;color:#fff;animation:blink 1.2s ease-in-out infinite}
.stat.exam.over b,.stat.exam.over .i{color:#fff}
.stat.exam.ended{background:var(--ok-soft);border-color:var(--ok-line);color:var(--ok)}
.stat.warn .i,.stat.warn b{color:var(--w2)}
.stat.ok .i,.stat.ok b{color:var(--ok)}
.stat.wc.busy{border-color:var(--wc-line);background:var(--wc-soft);color:var(--wc)}
.stat.wc.busy b{color:var(--wc)}
.stat.wc.over{background:var(--w3-soft);border-color:var(--w3-line);color:var(--w3);animation:blink 1.2s ease-in-out infinite}
.stat.wc.over b{color:var(--w3)}
.stat.on{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 35%,var(--line));color:var(--accent)}
.stat.on b{color:var(--accent)}
@keyframes blink{50%{opacity:.72}}

/* ============================================================
   MAPA
   ============================================================ */
.map{position:relative;flex:1;min-height:0;overflow:hidden;touch-action:none;-webkit-touch-callout:none;background-color:var(--map);background-image:radial-gradient(circle,var(--dot) 1.1px,transparent 1.5px);cursor:grab;-webkit-user-select:none;user-select:none}
.map.panning{cursor:grabbing}
.map::after{content:"";position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 0 3px var(--mode-c);opacity:0;transition:opacity .2s}
.app:not([data-mode="view"]) .map::after{opacity:.85}
.app.swapping .map::after{opacity:1;box-shadow:inset 0 0 0 3px var(--accent)}
.world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
.board{position:absolute;left:0;top:0;height:42px;display:flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;background:var(--surface);border:1px solid var(--line);color:var(--muted);font-size:11.5px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;box-shadow:var(--sh-1);transition:translate .24s cubic-bezier(.2,.8,.2,1),width .24s}
.board .i{width:16px;height:16px}

.seat{position:absolute;left:0;top:0;width:120px;height:100px;padding:9px 10px 8px;border-radius:17px;background:var(--seat);border:1.5px solid var(--seat-line);box-shadow:var(--sh-1);display:flex;flex-direction:column;cursor:pointer;touch-action:none;outline:none;transition:translate .24s cubic-bezier(.2,.8,.2,1),scale .15s ease,box-shadow .18s,background-color .18s,border-color .18s}
.seat:focus-visible{box-shadow:0 0 0 3px var(--accent),var(--sh-2)}
.s-head{display:flex;align-items:center;justify-content:space-between;gap:6px;height:22px}
.s-num{font-size:17px;font-weight:850;letter-spacing:-.03em;color:var(--seat-num);font-variant-numeric:tabular-nums;line-height:1}
.s-tm{max-width:74px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:3px 8px;border-radius:99px;font-size:12px;font-weight:850;line-height:1.15;background:hsl(var(--h) var(--tm-s1) var(--tm-l1));color:hsl(var(--h) var(--tm-s2) var(--tm-l2))}
.s-name{flex:1;margin-top:6px;font-size:14.5px;line-height:1.13;font-weight:750;letter-spacing:-.015em;color:var(--text);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.s-name.empty{color:var(--muted);opacity:.45;font-weight:600}
.s-foot{display:flex;align-items:center;gap:4px;height:22px}
.sp{flex:1}
.sb{display:inline-flex;align-items:center;gap:3px;height:21px;padding:0 7px 0 5px;border-radius:99px;font-size:11.5px;font-weight:800;white-space:nowrap;font-variant-numeric:tabular-nums}
.sb .i{width:13px;height:13px;stroke-width:2.4}
.sb-wc{background:var(--wc);color:var(--on-strong)}
.sb-q{background:var(--wc-soft);color:var(--wc);box-shadow:inset 0 0 0 1px var(--wc-line)}
.sb-ok{background:var(--ok-soft);color:var(--ok)}
.sb-taken{background:var(--w3-soft);color:var(--w3)}
.sb-abs{background:var(--surface-3);color:var(--muted);padding:0 8px}
.sw{display:inline-flex;align-items:center;gap:3px;height:21px;padding:0 7px 0 5px;border-radius:99px;font-size:12px;font-weight:850;color:var(--on-strong)}
.sw .i{width:13px;height:13px;stroke-width:2.6}
.sw.l1{background:var(--w1)}.sw.l2{background:var(--w2)}.sw.l3{background:var(--w3)}
.seat.l1{background:color-mix(in srgb,var(--w1) 10%,var(--seat));border-color:color-mix(in srgb,var(--w1) 48%,var(--seat-line))}
.seat.l2{background:color-mix(in srgb,var(--w2) 15%,var(--seat));border-color:color-mix(in srgb,var(--w2) 60%,var(--seat-line))}
.seat.l3{background:color-mix(in srgb,var(--w3) 16%,var(--seat));border-color:var(--w3);box-shadow:0 0 0 3px color-mix(in srgb,var(--w3) 22%,transparent),var(--sh-1)}
.seat.st-absent{background:color-mix(in srgb,var(--seat) 40%,transparent);border-style:dashed;box-shadow:none}
.seat.st-absent .s-name,.seat.st-absent .s-num,.seat.st-absent .s-tm{opacity:.45}
.seat.st-absent .s-name{text-decoration:line-through}
.seat.st-done{background:color-mix(in srgb,var(--ok) 9%,var(--seat));border-color:color-mix(in srgb,var(--ok) 45%,var(--seat-line))}
.seat.st-done .s-name{opacity:.6}
.seat.st-taken{border-color:var(--w3)}
.seat.st-taken .s-name{opacity:.6}
.seat.wc-out{border-color:var(--wc);box-shadow:0 0 0 3px color-mix(in srgb,var(--wc) 28%,transparent),var(--sh-1)}
.seat.over{border-color:var(--w3);animation:overPulse 1.25s ease-in-out infinite}
.seat.over .sb-wc{background:var(--w3)}
@keyframes overPulse{50%{box-shadow:0 0 0 8px color-mix(in srgb,var(--w3) 28%,transparent),var(--sh-1)}}
.seat.sel{border-color:var(--accent)!important;box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 32%,transparent),var(--sh-2)!important}
.seat.swap-src{outline:2.5px dashed var(--accent);outline-offset:5px}
.seat.dragging{transition:scale .15s,box-shadow .15s;scale:1.07;z-index:10;box-shadow:var(--sh-3);border-color:var(--accent);cursor:grabbing}
.seat.flash{animation:flashS .5s cubic-bezier(.2,.9,.2,1)}
@keyframes flashS{0%{scale:1}30%{scale:1.13}65%{scale:.97}100%{scale:1}}
.seat.hl{animation:hl 1.2s ease}
@keyframes hl{0%,100%{box-shadow:var(--sh-1)}25%,75%{box-shadow:0 0 0 7px color-mix(in srgb,var(--accent) 45%,transparent),var(--sh-2)}}
.seat.pop{animation:popIn .32s cubic-bezier(.2,.9,.3,1.25)}
@keyframes popIn{from{scale:.55;opacity:0}to{scale:1;opacity:1}}
.lens-turmas .seat.has-tm{background:hsl(var(--h) var(--tm-s1) var(--tm-l1));border-color:hsl(var(--h) var(--tm-s3) var(--tm-l3))}
.lens-turmas .seat.has-tm .s-tm{background:hsl(var(--h) var(--tm-s2) var(--tm-l2));color:hsl(var(--h) var(--tm-s1) var(--tm-l1))}
.seat.conflict::after{content:"";position:absolute;inset:-6px;border-radius:22px;border:2px dashed var(--w3);pointer-events:none}
@media (hover:hover){
  .seat:hover{box-shadow:var(--sh-2)}
  .app[data-mode="warn"] .seat:hover{border-color:var(--w2)}
  .app[data-mode="presence"] .seat:hover{border-color:var(--m-presence)}
  .app[data-mode="done"] .seat:hover{border-color:var(--ok)}
  .app[data-mode="wc"] .seat:hover{border-color:var(--wc)}
  .app[data-mode="edit"] .seat:hover{cursor:grab}
  .app.swapping .seat:hover{border-color:var(--accent)}
}

.mapctl{position:absolute;top:10px;right:10px;z-index:5;display:flex;gap:2px;padding:4px;border-radius:14px;background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line);box-shadow:var(--sh-1);transition:right .28s cubic-bezier(.2,.9,.2,1)}
.mapctl button{width:36px;height:36px;border-radius:10px;border:0;background:transparent;display:grid;place-items:center;color:var(--text-2);transition:background .15s,transform .1s}
.mapctl button:active{transform:scale(.9)}
.mapctl button .i{width:19px;height:19px}
.mapctl button.on{background:var(--accent-soft);color:var(--accent)}
.mapctl .sep{width:1px;margin:6px 2px;background:var(--line)}
@media (hover:hover){.mapctl button:hover{background:var(--surface-3)}}
.focus-pill{position:absolute;top:10px;left:10px;z-index:5;display:none;align-items:center;gap:6px;padding:4px;border-radius:14px;background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line);box-shadow:var(--sh-1)}
.app.focus .focus-pill{display:flex}
.app.focus .map{padding-top:var(--sat)}
.focus-pill .stat{height:36px}
.map-empty{position:absolute;inset:0;display:grid;place-items:center;padding:20px;pointer-events:none}
.map-empty > div{pointer-events:auto;text-align:center;max-width:320px;padding:24px;border-radius:22px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--sh-2)}
.map-empty b{display:block;font-size:17px;margin:10px 0 4px}
.map-empty p{margin:0 0 16px;color:var(--muted);font-size:13.5px;line-height:1.45}

/* ============================================================
   DOCK + CONTEXTO
   ============================================================ */
.dock{position:fixed;left:50%;bottom:calc(10px + var(--sab));transform:translateX(-50%);z-index:40;width:min(600px,calc(100vw - 16px));display:flex;gap:2px;padding:5px;border-radius:22px;background:var(--glass);backdrop-filter:blur(20px) saturate(1.5);-webkit-backdrop-filter:blur(20px) saturate(1.5);border:1px solid var(--line);box-shadow:var(--sh-2)}
.mode{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;height:54px;padding:0 2px;border-radius:17px;border:0;background:transparent;color:var(--text-2);font-size:10.5px;font-weight:750;letter-spacing:-.01em;transition:background .18s,color .18s,transform .1s}
.mode span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mode .i{width:21px;height:21px}
.mode:active{transform:scale(.93)}
.mode.on{background:var(--mc);color:var(--on-strong);box-shadow:0 6px 16px color-mix(in srgb,var(--mc) 38%,transparent)}
@media (hover:hover){.mode:not(.on):hover{background:var(--surface-3)}}
@media (max-width:350px){.mode span{font-size:9.5px}}
.ctx{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + var(--sab));z-index:39;width:min(600px,calc(100vw - 16px));padding:7px;border-radius:18px;background:var(--glass);backdrop-filter:blur(20px) saturate(1.5);-webkit-backdrop-filter:blur(20px) saturate(1.5);border:1px solid color-mix(in srgb,var(--mode-c) 40%,var(--line));box-shadow:var(--sh-2);animation:ctxIn .22s cubic-bezier(.2,.9,.2,1)}
@keyframes ctxIn{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
.ctx-row{display:flex;align-items:center;gap:6px;overflow-x:auto;scrollbar-width:none}
.ctx-row::-webkit-scrollbar{display:none}
.ctx-hint{display:inline-flex;align-items:center;gap:6px;flex:none;padding:0 6px;font-size:12.5px;font-weight:700;color:var(--text-2);white-space:nowrap}
.ctx-hint .i{width:17px;height:17px;color:var(--mode-c)}
.ctx-num{flex:none;font-size:13px;font-weight:700;color:var(--muted);padding:0 4px;font-variant-numeric:tabular-nums;white-space:nowrap}
.ctx-num b{color:var(--text);font-size:15px}
.ctx .sp{flex:1;min-width:4px}
.wcpill{flex:none;display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 4px 0 11px;border-radius:12px;background:var(--wc-soft);color:var(--wc);font-size:13px;font-weight:750;white-space:nowrap}
.wcpill .live{font-size:15px;font-weight:850;font-variant-numeric:tabular-nums}
.wcpill.over{background:var(--w3-soft);color:var(--w3);animation:blink 1.2s infinite}
.pill{flex:none;display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 10px;border-radius:99px;font-size:12px;font-weight:800;white-space:nowrap}
.pill .i{width:14px;height:14px}
.pill.amber{background:var(--w1-soft);color:var(--w1)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.wc{background:var(--wc-soft);color:var(--wc)}
.pill.red{background:var(--w3-soft);color:var(--w3)}
.pill.neutral{background:var(--surface-3);color:var(--text-2)}

/* ============================================================
   COMPONENTES
   ============================================================ */
.btn{flex:none;height:44px;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 15px;border-radius:13px;border:1px solid var(--line);background:var(--surface-2);font-weight:750;font-size:14px;color:var(--text);white-space:nowrap;transition:transform .1s,background .15s,border-color .15s,opacity .15s}
.btn:active:not(:disabled){transform:scale(.97)}
.btn:disabled{opacity:.45}
.btn .i{width:18px;height:18px}
.btn.primary{background:var(--accent);border-color:transparent;color:var(--on-accent)}
.btn.danger{color:var(--danger);background:var(--danger-soft);border-color:color-mix(in srgb,var(--danger) 25%,transparent)}
.btn.ok{color:var(--ok);background:var(--ok-soft);border-color:var(--ok-line)}
.btn.wc{color:var(--wc);background:var(--wc-soft);border-color:var(--wc-line)}
.btn.warn{color:var(--w2);background:var(--w2-soft);border-color:var(--w2-line)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.on{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 40%,transparent);color:var(--accent)}
.btn.sm{height:36px;padding:0 11px;font-size:13px;border-radius:11px;gap:6px}
.btn.sm .i{width:16px;height:16px}
.btn.block{width:100%}
.btn.grow,.grow{flex:1 1 0}
@media (hover:hover){.btn:hover:not(:disabled):not(.primary){background:var(--surface-3)}.btn.primary:hover{filter:brightness(1.07)}}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.hint{margin:8px 2px 0;font-size:12.5px;line-height:1.45;color:var(--muted)}
.hint b{color:var(--text-2)}
.field{display:block;margin-top:12px}
.field > span{display:block;font-size:12.5px;font-weight:750;color:var(--text-2);margin:0 2px 6px}
.input,.field input,.field textarea,.field select{width:100%;height:46px;border-radius:13px;border:1px solid var(--line);background:var(--surface-2);padding:0 13px;font-size:16px;outline:none;transition:border-color .15s,box-shadow .15s,background .15s}
.field textarea,textarea.input{height:auto;min-height:46px;padding:11px 13px;resize:vertical;line-height:1.45}
.input:focus,.field input:focus,.field textarea:focus{border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 16%,transparent);background:var(--surface)}
input[type="time"]{font-variant-numeric:tabular-nums}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:1px}
.chips::-webkit-scrollbar{display:none}
.chips.wrap{flex-wrap:wrap;overflow:visible}
.chip{flex:none;height:34px;padding:0 12px;border-radius:99px;border:1px solid var(--line);background:var(--surface-2);font-size:13px;font-weight:700;color:var(--text-2);display:inline-flex;align-items:center;gap:5px;white-space:nowrap;transition:background .15s,color .15s,transform .1s}
.chip .i{width:15px;height:15px}
.chip:active{transform:scale(.95)}
.chip.on{background:var(--text);color:var(--bg);border-color:transparent}
.chip.warnc.on{background:var(--w2);color:var(--on-strong)}
.chip.tmchip{background:hsl(var(--h) var(--tm-s1) var(--tm-l1));color:hsl(var(--h) var(--tm-s2) var(--tm-l2));border-color:transparent}
.chip.tmchip.on{box-shadow:0 0 0 2px hsl(var(--h) var(--tm-s2) var(--tm-l2))}
.chip small{font-weight:800;opacity:.65}
.seg{display:flex;padding:3px;border-radius:13px;background:var(--surface-3);gap:2px}
.seg button{flex:1;min-width:0;height:38px;border:0;border-radius:10px;background:transparent;font-size:13px;font-weight:750;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 6px;transition:background .15s,color .15s}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:var(--sh-1)}
.seg.status button.on[data-v="present"]{color:var(--m-presence)}
.seg.status button.on[data-v="absent"]{color:var(--muted)}
.seg.status button.on[data-v="done"]{color:var(--ok)}
.seg.status button.on[data-v="taken"]{color:var(--w3)}
.sec-label{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:20px 2px 9px;font-size:11.5px;font-weight:850;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.sec-label .count{letter-spacing:0;text-transform:none;font-size:12px;padding:2px 8px;border-radius:99px;background:var(--surface-3);color:var(--text-2)}
.count.l1{background:var(--w1-soft);color:var(--w1)}.count.l2{background:var(--w2-soft);color:var(--w2)}.count.l3{background:var(--w3-soft);color:var(--w3)}
.list{display:flex;flex-direction:column;gap:6px}
.li{display:flex;align-items:center;gap:11px;padding:9px 10px 9px 9px;border-radius:14px;background:var(--surface-2);border:1px solid var(--line);min-height:56px;text-align:left;width:100%;color:var(--text);transition:transform .1s,background .15s}
button.li:active{transform:scale(.99)}
@media (hover:hover){button.li:hover{background:var(--surface-3)}}
.li.sm{min-height:48px;padding:6px 6px 6px 8px}
.av{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-weight:850;font-size:13.5px;background:var(--surface-3);color:var(--text-2);flex:none;font-variant-numeric:tabular-nums}
.av.sm{width:32px;height:32px;font-size:12px;border-radius:10px}
.av.l1{background:var(--w1-soft);color:var(--w1)}.av.l2{background:var(--w2-soft);color:var(--w2)}.av.l3{background:var(--w3-soft);color:var(--w3)}
.av.wc{background:var(--wc-soft);color:var(--wc)}
.av.ok{background:var(--ok-soft);color:var(--ok)}
.av.abs{background:transparent;border:1.5px dashed var(--line-2);color:var(--muted)}
.mid{flex:1;min-width:0}
.mid b{display:block;font-size:14px;font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mid small{display:block;font-size:12px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.empty{padding:22px 12px;text-align:center;color:var(--muted);font-size:13.5px;line-height:1.5}
.empty .i{width:28px;height:28px;margin:0 auto 8px;opacity:.6}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px}
.kpi{padding:11px 12px;border-radius:14px;background:var(--surface-2);border:1px solid var(--line)}
.kpi b{display:block;font-size:22px;font-weight:850;font-variant-numeric:tabular-nums;letter-spacing:-.03em;line-height:1.1}
.kpi span{font-size:12px;color:var(--muted);font-weight:650}
.kpi.warn b{color:var(--w2)}.kpi.ok b{color:var(--ok)}.kpi.wc b{color:var(--wc)}.kpi.red b{color:var(--w3)}
.stepper{display:flex;align-items:center;gap:4px;flex:none}
.stepper button{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:var(--surface-2);display:grid;place-items:center}
.stepper button .i{width:17px;height:17px}
.stepper output{min-width:42px;text-align:center;font-weight:850;font-size:17px;font-variant-numeric:tabular-nums}
.setrow{display:flex;align-items:center;gap:12px;padding:12px 2px;border-bottom:1px solid var(--line);cursor:default}
label.setrow{cursor:pointer}
.setrow:last-child{border-bottom:0}
.setrow .mid b{white-space:normal}
.setrow .mid small{white-space:normal}
.switch{appearance:none;-webkit-appearance:none;margin:0;width:48px;height:29px;border-radius:99px;background:var(--line-2);position:relative;transition:background .2s;flex:none;cursor:pointer}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:23px;height:23px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:translate .2s cubic-bezier(.2,.9,.2,1)}
.switch:checked{background:var(--accent)}
.switch:checked::after{translate:19px 0}
.card{padding:14px;border-radius:18px;background:var(--surface-2);border:1px solid var(--line)}
.menu-grp{display:flex;flex-direction:column;border-radius:16px;border:1px solid var(--line);background:var(--surface-2);overflow:hidden}
.menu-it{display:flex;align-items:center;gap:12px;min-height:52px;padding:8px 14px;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;width:100%;color:var(--text);font-size:14.5px;font-weight:700}
.menu-it:last-child{border-bottom:0}
.menu-it .i{color:var(--text-2)}
.menu-it .mid small{font-weight:600}
.menu-it.danger,.menu-it.danger .i{color:var(--danger)}
.menu-it kbd{font:inherit;font-size:11px;font-weight:800;padding:2px 7px;border-radius:7px;background:var(--surface-3);color:var(--muted)}
@media (hover:hover){.menu-it:hover{background:var(--surface-3)}}

/* seat sheet */
.seat-badge{width:46px;height:46px;flex:none;border-radius:14px;display:grid;place-items:center;font-size:19px;font-weight:850;font-variant-numeric:tabular-nums;background:var(--surface-3);color:var(--text-2);letter-spacing:-.03em}
.seat-badge.l1{background:var(--w1);color:var(--on-strong)}.seat-badge.l2{background:var(--w2);color:var(--on-strong)}.seat-badge.l3{background:var(--w3);color:var(--on-strong)}
.seat-badge.st-absent{background:transparent;border:2px dashed var(--line-2);color:var(--muted)}
.bigacts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.bigbtn{display:flex;align-items:center;gap:11px;padding:11px;border-radius:17px;border:1px solid;text-align:left;min-height:68px;transition:transform .1s,filter .15s}
.bigbtn:active{transform:scale(.97)}
.bigbtn .bi{width:42px;height:42px;flex:none;border-radius:13px;display:grid;place-items:center;color:var(--on-strong)}
.bigbtn .bi .i{width:22px;height:22px}
.bigbtn b{display:block;font-size:15px;font-weight:800}
.bigbtn small{display:block;font-size:12px;opacity:.8;font-weight:650;margin-top:1px;font-variant-numeric:tabular-nums}
.bigbtn.warn{background:var(--w2-soft);border-color:var(--w2-line);color:var(--w2)}
.bigbtn.warn .bi{background:var(--w2)}
.bigbtn.warn.l3{background:var(--w3-soft);border-color:var(--w3-line);color:var(--w3)}
.bigbtn.warn.l3 .bi{background:var(--w3)}
.bigbtn.wc{background:var(--wc-soft);border-color:var(--wc-line);color:var(--wc)}
.bigbtn.wc .bi{background:var(--wc)}
.bigbtn.wc.out .bi{animation:blink 1.4s infinite}
.wbar{height:7px;border-radius:9px;background:var(--surface-3);overflow:hidden;margin:-2px 0 10px}
.wbar i{display:block;height:100%;border-radius:9px;transition:width .3s}
.wbar.l1 i{background:var(--w1)}.wbar.l2 i{background:var(--w2)}.wbar.l3 i{background:var(--w3)}

/* bathroom */
.wcnow{padding:15px;border-radius:19px;border:1px solid var(--wc-line);background:var(--wc-soft);display:flex;align-items:center;gap:12px;margin-bottom:8px}
.wcnow.over{border-color:var(--w3-line);background:var(--w3-soft)}
.wcnow.free{background:var(--surface-2);border-color:var(--line);flex-wrap:wrap}
.wc-t{font-size:34px;font-weight:850;font-variant-numeric:tabular-nums;letter-spacing:-.03em;line-height:1;color:var(--wc)}
.wcnow.over .wc-t{color:var(--w3)}
.wcnow .mid b{font-size:16px}
.numgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(48px,1fr));gap:6px}
.numgrid button{height:46px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);font-weight:800;font-size:15px;font-variant-numeric:tabular-nums;transition:transform .1s,background .15s}
.numgrid button:active:not(:disabled){transform:scale(.92)}
.numgrid button:disabled{opacity:.3}
.numgrid button.q{background:var(--wc-soft);color:var(--wc);border-color:var(--wc-line);opacity:1}
@media (hover:hover){.numgrid button:hover:not(:disabled){background:var(--wc-soft);border-color:var(--wc-line)}}

/* exam */
.exam-big{text-align:center;padding:20px 14px 16px;border-radius:22px;background:var(--surface-2);border:1px solid var(--line)}
.exam-big .lbl{font-size:11.5px;font-weight:850;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.exam-big .t{margin-top:6px;font-size:56px;font-weight:850;letter-spacing:-.045em;font-variant-numeric:tabular-nums;line-height:1}
.exam-big.amber .t{color:var(--w1)}.exam-big.red .t,.exam-big.over .t{color:var(--w3)}
.exam-big .meta{margin-top:10px;font-size:13px;color:var(--text-2);font-weight:650}
.pbar{height:8px;border-radius:9px;background:var(--surface-3);overflow:hidden;margin-top:14px}
.pbar i{display:block;height:100%;background:var(--accent);border-radius:9px;transition:width 1s linear}
.exam-big.amber .pbar i{background:var(--w1)}.exam-big.red .pbar i,.exam-big.over .pbar i{background:var(--w3)}

/* timeline */
.tl{display:flex;flex-direction:column}
.tl-i{display:flex;gap:11px;align-items:center;padding:9px 2px;border-bottom:1px solid var(--line);text-align:left;background:transparent;border-left:0;border-right:0;border-top:0;width:100%;color:var(--text)}
.tl-i:last-child{border-bottom:0}
.tl-t{width:42px;flex:none;font-size:12.5px;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
.tl-ic{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;flex:none;background:var(--surface-3);color:var(--text-2)}
.tl-ic .i{width:17px;height:17px}
.tl-ic.warn{background:var(--w2-soft);color:var(--w2)}
.tl-ic.wc{background:var(--wc-soft);color:var(--wc)}
.tl-ic.ok{background:var(--ok-soft);color:var(--ok)}
.tl-ic.red{background:var(--w3-soft);color:var(--w3)}
.tl-ic.pr{background:color-mix(in srgb,var(--m-presence) 14%,transparent);color:var(--m-presence)}
.tl-ic.acc{background:var(--accent-soft);color:var(--accent)}
.tl-day{font-size:11.5px;font-weight:850;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:14px 2px 2px}

/* report preview */
.paper{background:#fff;color:#151a28;border-radius:16px;border:1px solid var(--line);padding:12px;overflow:hidden}
.paper svg{display:block;width:100%;height:auto}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.prev-box{padding:12px 14px;border-radius:15px;background:var(--surface-2);border:1px solid var(--line);font-size:13.5px;line-height:1.5;color:var(--text-2)}
.prev-box b{color:var(--text)}
.prev-box .chips{margin-top:8px}
.prev-box.okb{background:var(--ok-soft);border-color:var(--ok-line)}
.prev-box.warnb{background:var(--w1-soft);border-color:var(--w1-line)}
.mini-grid{display:flex;flex-direction:column;gap:4px;align-items:center;padding:14px;border-radius:16px;background:var(--map);border:1px solid var(--line);overflow:auto}
.mini-grid .r{display:flex;gap:4px}
.mini-grid i{width:16px;height:13px;border-radius:4px;background:var(--surface);border:1px solid var(--line-2);flex:none}
.mini-grid i.ai{width:10px;background:transparent;border:0}
.mini-grid .bd{width:60%;height:8px;border-radius:4px;background:var(--line-2);margin-bottom:6px}
pre.txt{white-space:pre-wrap;word-break:break-word;font:inherit;font-size:13px;line-height:1.5;margin:0;padding:12px 14px;border-radius:15px;background:var(--surface-2);border:1px solid var(--line);color:var(--text-2);max-height:320px;overflow:auto}
.feat{display:flex;flex-direction:column;gap:10px}
.feat > div{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:16px;background:var(--surface-2);border:1px solid var(--line)}
.feat .bi{width:38px;height:38px;flex:none;border-radius:12px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.feat b{display:block;font-size:14.5px}
.feat small{display:block;font-size:12.5px;color:var(--muted);line-height:1.45;margin-top:2px;font-weight:550}
.kbd-list{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;align-items:center;font-size:14px}
.kbd-list kbd{font:inherit;font-weight:800;font-size:12.5px;padding:4px 9px;border-radius:8px;background:var(--surface-3);border:1px solid var(--line);text-align:center;white-space:nowrap}

/* ============================================================
   SHEET / DRAWER
   ============================================================ */
.scrim{position:fixed;inset:0;z-index:80;background:rgba(8,11,20,.36);opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;z-index:90;width:min(640px,100%);max-height:min(88dvh,920px);display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-bottom:0;border-radius:26px 26px 0 0;box-shadow:var(--sh-3);translate:0 calc(100% + 30px);transition:translate .3s cubic-bezier(.2,.9,.2,1);visibility:hidden}
.sheet.on{translate:0 0;visibility:visible}
.sheet.closing{visibility:visible}
.sheet-top{flex:none;touch-action:none}
.sheet-grab{width:42px;height:5px;border-radius:9px;background:var(--line-2);margin:9px auto 0}
.sheet-head{display:flex;align-items:center;gap:11px;padding:10px 14px 10px 16px}
.sh-ic{width:42px;height:42px;flex:none;border-radius:13px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.sh-ic.warn{background:var(--w2-soft);color:var(--w2)}.sh-ic.wc{background:var(--wc-soft);color:var(--wc)}.sh-ic.ok{background:var(--ok-soft);color:var(--ok)}
.sh-t{flex:1;min-width:0}
.sheet-title{font-size:18.5px;font-weight:850;letter-spacing:-.025em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet-sub{font-size:13px;color:var(--muted);font-weight:600;margin-top:1px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.35}
.sheet-body{flex:1;min-height:0;overflow:auto;padding:4px 16px 18px;overscroll-behavior:contain}
.sheet-foot{flex:none;display:flex;gap:8px;flex-wrap:wrap;padding:12px 16px calc(12px + var(--sab));border-top:1px solid var(--line);background:var(--surface)}
.sheet-body:last-child{padding-bottom:calc(18px + var(--sab))}
@media (min-width:1000px){
  .sheet{left:auto;right:12px;top:calc(var(--head-h,110px) + 10px);bottom:12px;margin:0;width:420px;max-height:none;border-radius:22px;border-bottom:1px solid var(--line);translate:calc(100% + 30px) 0}
  .sheet.on{translate:0 0}
  .sheet-grab{display:none}
  .sheet-foot{border-radius:0 0 22px 22px;padding-bottom:12px}
  .scrim{display:none}
  .app.has-sheet .mapctl{right:444px}
  .dock,.ctx,.toasts{transition:left .28s cubic-bezier(.2,.9,.2,1),width .28s}
  .app.has-sheet .dock,.app.has-sheet .ctx{left:calc((100% - 444px) / 2);width:min(600px,calc(100vw - 470px))}
  .app.has-sheet ~ .toasts{left:calc((100% - 444px) / 2);width:min(540px,calc(100vw - 470px))}
}

/* ============================================================
   DIALOG / TOAST
   ============================================================ */
.dlg-wrap{position:fixed;inset:0;z-index:400;display:grid;place-items:center;padding:16px;background:rgba(8,11,20,.5);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);animation:fade .15s}
.dlg{width:min(420px,100%);background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:20px;box-shadow:var(--sh-3);animation:dlgIn .22s cubic-bezier(.2,.9,.2,1)}
.dlg h3{margin:0;font-size:18.5px;font-weight:850;letter-spacing:-.02em}
.dlg p{margin:8px 0 0;color:var(--text-2);font-size:14px;line-height:1.5}
.dlg .input{margin-top:14px}
.dlg-btns{margin-top:18px}
.dlg-btns .btn{flex:1 1 auto}
@keyframes fade{from{opacity:0}}
@keyframes dlgIn{from{opacity:0;transform:translateY(10px) scale(.97)}}
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:var(--toast-b,96px);z-index:60;display:flex;flex-direction:column;align-items:center;gap:8px;width:min(540px,calc(100vw - 20px));pointer-events:none}
.toast{pointer-events:auto;display:flex;align-items:center;gap:10px;min-height:46px;max-width:100%;padding:6px 6px 6px 13px;border-radius:15px;background:#161b29;color:#fff;box-shadow:0 16px 40px rgba(10,14,25,.32);font-size:13.5px;font-weight:650;animation:toastIn .24s cubic-bezier(.2,.9,.2,1);cursor:default}
:root[data-theme="dark"] .toast{background:#262d40;border:1px solid #39415a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .toast{background:#262d40;border:1px solid #39415a}}
.toast.bump{animation:toastBump .3s cubic-bezier(.2,.9,.2,1)}
.toast .t-ic{width:28px;height:28px;flex:none;border-radius:9px;display:grid;place-items:center;background:rgba(255,255,255,.12)}
.toast .t-ic .i{width:17px;height:17px}
.toast .t-tx{flex:1;min-width:0;line-height:1.3;padding:4px 0}
.toast button{flex:none;height:34px;padding:0 12px;border-radius:10px;border:0;background:rgba(255,255,255,.14);color:#fff;font-weight:800;font-size:12.5px}
.toast button:active{background:rgba(255,255,255,.25)}
.toast.warn .t-ic{background:#f59e0b;color:#1b1206}
.toast.danger{background:#9f1239}
.toast.danger .t-ic{background:rgba(255,255,255,.2)}
.toast.wc .t-ic{background:#06b6d4;color:#04161b}
.toast.ok .t-ic{background:#22c55e;color:#03140a}
.toast.alert{min-height:58px;font-size:15px;font-weight:750;background:linear-gradient(135deg,#4f46e5,#7c3aed)}
.toast.alert.red{background:linear-gradient(135deg,#be123c,#e11d48)}
.toast.alert .t-ic{background:rgba(255,255,255,.2)}
.toast.out{animation:toastOut .18s forwards}
@keyframes toastIn{from{opacity:0;transform:translateY(12px) scale(.96)}}
@keyframes toastBump{0%{transform:scale(1)}40%{transform:scale(1.035)}100%{transform:scale(1)}}
@keyframes toastOut{to{opacity:0;transform:translateY(8px) scale(.97)}}

/* ============================================================
   TELÃO
   ============================================================ */
.telao{position:fixed;inset:0;z-index:300;display:flex;flex-direction:column;padding:calc(22px + var(--sat)) clamp(18px,4vw,48px) calc(22px + var(--sab));background:radial-gradient(1200px 700px at 50% -15%,#24205e 0%,#0b0d1a 55%,#05070d 100%);color:#eef1ff;font-variant-numeric:tabular-nums;overflow:hidden}
.tv-top{display:flex;justify-content:space-between;align-items:center;gap:16px;font-size:clamp(15px,2.3vw,28px);font-weight:700}
.tv-top .t1{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tv-top .t1 span{opacity:.6;font-weight:600}
.tv-clock{opacity:.75;font-weight:800}
.tv-main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.4vh;min-height:0}
.tv-label{font-size:clamp(14px,2.4vw,30px);letter-spacing:.22em;text-transform:uppercase;opacity:.65;font-weight:800;text-align:center}
.tv-time{font-size:min(22vw,40vh);font-weight:850;letter-spacing:-.045em;line-height:.92}
.telao.amber .tv-time{color:#fbbf24}
.telao.red .tv-time{color:#fb7185}
.telao.over .tv-time{color:#fb7185;animation:blink 1s steps(2) infinite}
.tv-bar{width:min(1100px,88vw);height:clamp(8px,1.4vh,14px);border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden}
.tv-bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#818cf8,#a78bfa);transition:width 1s linear}
.telao.amber .tv-bar i{background:#fbbf24}
.telao.red .tv-bar i,.telao.over .tv-bar i{background:#fb7185}
.tv-foot{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:clamp(8px,1.5vw,18px);font-size:clamp(14px,1.9vw,24px)}
.tv-foot > div{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:clamp(12px,1.6vw,20px);padding:clamp(10px,1.6vw,18px) clamp(12px,1.8vw,22px)}
.tv-foot small{display:block;opacity:.6;font-size:.6em;text-transform:uppercase;letter-spacing:.14em;font-weight:800;margin-bottom:4px}
.tv-foot b{font-size:1.35em;font-weight:850}
.tv-foot .okc b{color:#4ade80}
.tv-x{position:absolute;top:calc(12px + var(--sat));right:12px;width:46px;height:46px;border-radius:14px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);color:#fff;display:grid;place-items:center;opacity:.55}
.tv-x:hover{opacity:1}

/* ============================================================
   PRINT
   ============================================================ */
#print{display:none}
@media print{
  html,body{overflow:visible!important;height:auto!important;background:#fff!important;color:#000!important}
  body > *{display:none!important}
  body > #print{display:block!important}
}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}

/* centro visível do mapa em coordenadas "cruas" (para adicionar cadeira) */

/* ============================================================

const seatEls = new Map(); let firstMap = true; let lastConf = {set:new Set(), pairs:0};
function renderMap(){
  const r = room(), st = S();
  app.classList.toggle('lens-turmas', st.lens === 'turmas');
  lastConf = st.lens === 'turmas' ? conflicts(r) : {set:new Set(), pairs:0};
  const selId = sheet && sheet.name === 'seat' ? sheet.p.id : null;
  const seen = new Set();
  for (const s of r.seats){
    let el = seatEls.get(s.id);
    if (!el){
      el = document.createElement('div'); el.dataset.id = s.id; el.tabIndex = 0; el.setAttribute('role', 'button');
      world.appendChild(el); seatEls.set(s.id, el);
      if (!firstMap){ el.className = 'seat pop'; setTimeout(() => el.classList.remove('pop'), 400); }
    }
    seen.add(s.id); paintSeat(el, s, r, selId);
  }
  for (const [id, el] of seatEls) if (!seen.has(id)){ el.remove(); seatEls.delete(id); }
  const br = boardRaw(r);
  if (br){ const d = toDisp(br, r); boardEl.hidden = false; boardEl.style.translate = `${d.x}px ${d.y}px`; boardEl.style.width = d.w + 'px'; }
  else boardEl.hidden = true;
  emptyEl.hidden = r.seats.length > 0;
  $('#flipBtn').classList.toggle('on', !!r.view.flip);
  $('#lensBtn').classList.toggle('on', st.lens === 'turmas');
  firstMap = false;
}
function paintSeat(el, s, r = room(), selId = (sheet && sheet.name === 'seat' ? sheet.p.id : null)){
  if (!el) return;
  const wi = wcInfo(r, s.id), c = s.warns.length, lvl = warnLevel(c);
  const over = wi && wi.type === 'out' && now() - wi.since >= S().wcLimit * 60000;
  const h = s.turma.trim() ? H.get(s.turma.trim()) : null;
  const cls = ['seat', 'l' + lvl, 'st-' + s.status];
  if (wi) cls.push('wc-' + wi.type);
  if (over) cls.push('over');
  if (h != null) cls.push('has-tm');
  if (lastConf.set.has(s.id)) cls.push('conflict');
  if (s.id === selId) cls.push('sel');
  if (s.id === swapFrom) cls.push('swap-src');
  if (s.id === dragId) cls.push('dragging');
  for (const k of ['pop', 'hl', 'flash']) if (el.classList.contains(k)) cls.push(k);
  const cn = cls.join(' '); if (el.className !== cn) el.className = cn;
  if (h != null) el.style.setProperty('--h', h); else el.style.removeProperty('--h');
  const p = dpos(s, r); el.style.translate = `${p.x}px ${p.y}px`;
  const html = seatHTML(s, wi, c, lvl);
  if (el._h !== html){ el.innerHTML = html; el._h = html; }
  el.setAttribute('aria-label', `Cadeira ${s.n}${s.name ? ', ' + s.name : ''}${s.turma ? ', turma ' + s.turma : ''}, ${STATUS[s.status]}, ${plural(c, 'advertência', 'advertências')}`);
}
function seatHTML(s, wi, c, lvl){
  let foot = '';
  if (wi && wi.type === 'out') foot = `<span class="sb sb-wc">${ic('door')}<b class="live" data-since="${wi.since}">${dur(now() - wi.since)}</b></span>`;
  else if (wi && wi.type === 'queue') foot = `<span class="sb sb-q">${ic('door')}Fila ${wi.pos}º</span>`;
  else if (s.status === 'done') foot = `<span class="sb sb-ok">${ic('check')}${s.doneAt ? hhmm(s.doneAt) : 'Entregou'}</span>`;
  else if (s.status === 'taken') foot = `<span class="sb sb-taken">${ic('flag')}Recolhida</span>`;
  else if (s.status === 'absent') foot = `<span class="sb sb-abs">Ausente</span>`;

  return `<div class="s-head"><span class="s-num">${s.n}</span>${s.turma.trim() ? `<span class="s-tm">${esc(s.turma)}</span>` : ''}</div>`

const paintOne = id => { const s = seatOf(id); if (s) paintSeat(seatEls.get(id), s); };
function flash(id, cls){

/* ============================================================
   GESTOS
   ============================================================ */
const ptrs = new Map(); let g = null; let lastTap = {id:null, t:0, timer:0};
mapEl.addEventListener('pointerdown', e => {
  if (e.target.closest('.mapctl, .focus-pill, .map-empty > div')) return;
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  unlockAudio();
  ptrs.set(e.pointerId, {x:e.clientX, y:e.clientY});
  try { mapEl.setPointerCapture(e.pointerId); } catch (_) {}
  if (ptrs.size === 1){
    const sEl = e.target.closest('.seat'), id = sEl ? sEl.dataset.id : null;
    g = {k:'pending', id, sx:e.clientX, sy:e.clientY, c0:{...cam}};
    if (id && mode === 'edit' && !swapFrom) g.k = 'pre-drag';
    else if (id) g.lp = setTimeout(longPress, 430);
  } else if (ptrs.size === 2){
    if (g){ clearTimeout(g.lp); if (g.k === 'drag') finishDrag(false); }
    const [a, b] = [...ptrs.values()];
    g = {k:'pinch', d0:Math.hypot(a.x - b.x, a.y - b.y) || 1, s0:cam.s, m0:{x:(a.x + b.x) / 2, y:(a.y + b.y) / 2}, c0:{...cam}};
  }
});
mapEl.addEventListener('pointermove', e => {
  const p = ptrs.get(e.pointerId); if (!p || !g) return;
  p.x = e.clientX; p.y = e.clientY;
  if (g.k === 'pinch'){
    if (ptrs.size < 2) return;
    const [a, b] = [...ptrs.values()], d = Math.hypot(a.x - b.x, a.y - b.y), m = {x:(a.x + b.x) / 2, y:(a.y + b.y) / 2};
    const mr = mapEl.getBoundingClientRect(), ns = clamp(g.s0 * d / g.d0, MIN_S, MAX_S);
    const wx = (g.m0.x - mr.left - g.c0.x) / g.s0, wy = (g.m0.y - mr.top - g.c0.y) / g.s0;
    cam.s = ns; cam.x = m.x - mr.left - wx * ns; cam.y = m.y - mr.top - wy * ns; applyCam(); return;
  }
  const dx = e.clientX - g.sx, dy = e.clientY - g.sy, dist = Math.hypot(dx, dy);
  if (g.k === 'pending' && dist > 9){ clearTimeout(g.lp); g.k = 'pan'; mapEl.classList.add('panning'); cancelAnimationFrame(camAnim); }
  else if (g.k === 'pre-drag' && dist > 5) beginDrag();
  if (g.k === 'pan'){ cam.x = g.c0.x + dx; cam.y = g.c0.y + dy; applyCam(); }
  else if (g.k === 'drag') dragMove(e.clientX, e.clientY);
});
function endPtr(e, cancelled){
  if (!ptrs.has(e.pointerId)) return; ptrs.delete(e.pointerId);
  if (!g) return;
  if (g.k === 'pinch'){
    if (ptrs.size === 1){ const [p] = [...ptrs.values()]; g = {k:'pan', sx:p.x, sy:p.y, c0:{...cam}}; } else if (!ptrs.size) g = null;
    return;
  }
  clearTimeout(g.lp);
  if (!cancelled && (g.k === 'pending' || g.k === 'pre-drag')) onTap(g.id);
  else if (g.k === 'drag') finishDrag(cancelled);
  mapEl.classList.remove('panning');
  if (!ptrs.size) g = null;
}
mapEl.addEventListener('pointerup', e => endPtr(e, false));
mapEl.addEventListener('pointercancel', e => endPtr(e, true));
mapEl.addEventListener('lostpointercapture', e => { if (ptrs.has(e.pointerId)) endPtr(e, true); });
mapEl.addEventListener('contextmenu', e => e.preventDefault());
mapEl.addEventListener('wheel', e => {
  if (e.target.closest('.mapctl, .map-empty > div')) return;
  e.preventDefault(); cancelAnimationFrame(camAnim);
  const mouseLike = e.ctrlKey || e.deltaMode !== 0 || (e.deltaX === 0 && Math.abs(e.deltaY) >= 40 && Number.isInteger(e.deltaY));
  if (mouseLike) zoomAt(Math.exp(-e.deltaY * (e.ctrlKey ? .012 : .0018)), e.clientX, e.clientY);
  else { cam.x -= e.deltaX; cam.y -= e.deltaY; applyCam(); }
}, {passive:false});
document.addEventListener('gesturestart', e => e.preventDefault());
world.addEventListener('keydown', e => {
  const el = e.target.closest('.seat'); if (!el) return;
  if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); onTap(el.dataset.id, true); }
});

function longPress(){
  if (!g || g.k !== 'pending' || !g.id) return;
  haptic(18);
  if (mode === 'view' && !swapFrom){ g.k = 'pre-drag'; beginDrag(); }
  else { g.k = 'done'; openSheet('seat', {id:g.id}); }
}
function beginDrag(){
  const s = seatOf(g.id); if (!s){ g.k = 'pan'; return; }
  clearTimeout(lastTap.timer); lastTap = {id:null, t:0, timer:0};
  g.k = 'drag'; g.before = snap(); g.ox = s.x; g.oy = s.y; dragId = s.id;
  const el = seatEls.get(s.id); if (el) el.classList.add('dragging');
  haptic(10);
}
function dragMove(cx, cy){
  const r = room(), s = seatOf(g.id); if (!s) return;
  const f = r.view.flip ? -1 : 1;
  let nx = g.ox + f * (cx - g.sx) / cam.s, ny = g.oy + f * (cy - g.sy) / cam.s;
  if (S().snap){
    const T = 14 / Math.max(cam.s, .4); let bx = null, by = null, bdx = T, bdy = T;
    for (const o of r.seats){ if (o === s) continue; const ddx = Math.abs(o.x - nx), ddy = Math.abs(o.y - ny); if (ddx < bdx){ bdx = ddx; bx = o.x; } if (ddy < bdy){ bdy = ddy; by = o.y; } }
    if (bx != null) nx = bx; if (by != null) ny = by;
  }
  s.x = Math.round(nx); s.y = Math.round(ny);
  const el = seatEls.get(s.id), p = dpos(s, r); if (el) el.style.translate = `${p.x}px ${p.y}px`;
}
function finishDrag(cancelled){
  const s = seatOf(g.id); dragId = null;
  const el = seatEls.get(g.id); if (el) el.classList.remove('dragging');
  if (!s) return;
  if (cancelled && g.before && !(Math.hypot(s.x - g.ox, s.y - g.oy) > 1)){ render(); return; }
  if (Math.hypot(s.x - g.ox, s.y - g.oy) > 1){
    pushUndo(g.before, 'Mover cadeira'); save(); render();
    if (mode !== 'edit') toast(`Cadeira ${s.n} movida`, {icon:'move', key:'undo', actions:[{label:'Desfazer', fn:undo}]});
  } else render();
}

function onTap(id, kbd = false){
  if (!id){
    if (swapFrom) return;
    if (sheet && sheet.name === 'seat') closeSheet();
    return;
  }
  if (swapFrom){ doSwap(id); return; }
  switch (mode){
    case 'view':
      if (S().dblTap && !kbd){
        if (lastTap.id === id && now() - lastTap.t < 320){ clearTimeout(lastTap.timer); lastTap = {id:null, t:0, timer:0}; addWarn(id, ''); }
        else { clearTimeout(lastTap.timer); lastTap = {id, t:now(), timer:setTimeout(() => { lastTap = {id:null, t:0, timer:0}; openSheet('seat', {id}); }, 270)}; }
      } else openSheet('seat', {id});
      break;
    case 'warn': addWarn(id, warnType); break;
    case 'presence': togglePresence(id); break;
    case 'done': toggleDone(id); break;
    case 'wc': wcTap(id); break;
    case 'edit': openSheet('seat', {id}); break;
  }
}

/* ============================================================
   AÇÕES — ALUNO / CADEIRA
   ============================================================ */
function setMode(m, silent){
  if (!MODES.some(x => x.id === m)) return;
  const changed = m !== mode;
  mode = m; S().lastMode = m; save();
  if (swapFrom) cancelSwap(true);
  clearTimeout(lastTap.timer); lastTap = {id:null, t:0, timer:0};
  render();
  if (changed && !silent){ const md = MODES.find(x => x.id === m); toast(md.hint, {icon:md.icon, key:'hint', ms:2200}); haptic(6); }
}
function addWarn(id, type = ''){
  const s = seatOf(id); if (!s) return;
  const L = S().warnLimit, next = s.warns.length + 1;
  commit('Advertência', () => { s.warns.push({id:uid(), t:now(), type}); return `${who(s)} · ${next}ª advertência${type ? ' — ' + type : ''}`; },
    {icon:'alert', tone:next >= L ? 'danger' : 'warn'});
  flash(id, 'flash');
  if (next === L){
    haptic([40, 60, 40, 60, 90]); beep('limit');
    toast(`${whoLong(s)} atingiu o limite de ${L} advertências`, {key:'limit', icon:'flag', tone:'danger', ms:8000, actions:[{label:'Recolher prova', fn:() => setStatus(id, 'taken')}]});
  } else haptic([14, 40, 14]);
}
function delWarn(id, wid){
  const s = seatOf(id); if (!s) return;
  commit('Remover advertência', () => { const i = s.warns.findIndex(w => w.id === wid); if (i < 0) return false; s.warns.splice(i, 1); return `${who(s)} · advertência removida (${s.warns.length})`; }, {icon:'trash'});
}
function wcDrop(r, id){
  r.wc.queue = r.wc.queue.filter(q => q.seatId !== id);
  const oi = r.wc.out.findIndex(o => o.seatId === id);
  if (oi >= 0){ const o = r.wc.out.splice(oi, 1)[0], s = seatOf(id, r); r.wc.hist.push({seatId:id, n:s ? s.n : null, name:s ? s.name : '', turma:s ? s.turma : '', out:o.since, back:now()}); }
}
async function setStatus(id, v){
  const r = room(), s = seatOf(id); if (!s || s.status === v || !STATUS[v]) return;
  if (v === 'done' && !(await exitCheck(r))) return;
  if (v === 'taken' && !(await confirmBox('Recolher prova?', `${whoLong(s)} terá a prova recolhida (fica registrado no relatório com o horário).`, 'Recolher', true))) return;
  const icons = {present:'userCheck', absent:'userX', done:'fileCheck', taken:'flag'};
  commit('Situação do aluno', rr => {
    s.status = v; s.statusAt = now(); s.doneAt = (v === 'done' || v === 'taken') ? now() : null;
    if (v !== 'present') wcDrop(rr, id);
    return `${who(s)}: ${STATUS[v].toLowerCase()}`;
  }, {icon:icons[v], tone:v === 'taken' ? 'danger' : v === 'done' ? 'ok' : ''});
  flash(id, 'flash');
}
function togglePresence(id){
  const s = seatOf(id); if (!s) return;
  const toAbsent = s.status !== 'absent';
  commit('Presença', r => {
    s.status = toAbsent ? 'absent' : 'present'; s.statusAt = now(); s.doneAt = null;
    if (toAbsent) wcDrop(r, id);
    const st = stats(r); return `${who(s)}: ${toAbsent ? 'ausente' : 'presente'} · ${st.present}/${st.total} presentes`;
  }, {icon:toAbsent ? 'userX' : 'userCheck'});
  flash(id, 'flash'); haptic(8);
}
function allPresent(){
  const r = room(); const n = r.seats.filter(s => s.status === 'absent').length;
  if (!n){ toast('Todos já estão presentes', {icon:'userCheck', key:'undo'}); return; }
  commit('Todos presentes', rr => { rr.seats.forEach(s => { if (s.status === 'absent'){ s.status = 'present'; s.statusAt = now(); } }); return `${plural(n, 'aluno marcado', 'alunos marcados')} como presente`; }, {icon:'userCheck'});
}
async function exitCheck(r){
  const ea = exitAt(r.exam);
  if (ea && now() < ea && examState(r.exam) === 'running')
    return confirmBox('Antes do tempo mínimo', `A saída só é liberada às ${hhmm(ea)} (faltam ${durShort(ea - now())}). Registrar a entrega mesmo assim?`, 'Registrar');
  return true;
}
async function toggleDone(id){
  const r = room(), s = seatOf(id); if (!s) return;
  if (s.status === 'done' || s.status === 'taken'){
    commit('Desfazer entrega', () => { s.status = 'present'; s.doneAt = null; s.statusAt = now(); return `${who(s)}: entrega desfeita`; }, {icon:'undo'});
    return;
  }
  if (s.status === 'absent'){ toast(`${who(s)} está como ausente`, {icon:'userX', key:'undo'}); return; }
  if (!(await exitCheck(r))) return;
  commit('Entrega', rr => { s.status = 'done'; s.doneAt = now(); s.statusAt = now(); wcDrop(rr, id); const st = stats(rr); return `${who(s)} entregou · ${st.done + st.taken}/${st.present}`; }, {icon:'fileCheck', tone:'ok'});
  flash(id, 'flash'); haptic(12);
  const st = stats(room());
  if (st.present > 0 && st.inRoom === 0) toast('Todos os alunos entregaram! Hora do relatório.', {key:'all', icon:'sparkles', tone:'ok', ms:7000, actions:[{label:'Relatório', fn:() => openSheet('report')}]});
}

/* ---------- Banheiro ---------- */
function wcTap(id){
  const r = room(), s = seatOf(id); if (!s) return;
  const wi = wcInfo(r, id);
  if (wi && wi.type === 'out'){ wcReturn(id); return; }
  if (wi && wi.type === 'queue'){ commit('Sair da fila', rr => { rr.wc.queue = rr.wc.queue.filter(q => q.seatId !== id); return `${who(s)} saiu da fila`; }, {icon:'door', tone:'wc'}); return; }
  if (s.status === 'absent'){ toast(`${who(s)} está como ausente`, {icon:'userX', key:'undo'}); return; }
  if (s.status === 'done' || s.status === 'taken'){ toast(`${who(s)} já entregou a prova`, {icon:'fileCheck', key:'undo'}); return; }
  if (r.wc.out.length < S().wcMax && !r.wc.queue.length){
    commit('Banheiro', rr => { rr.wc.out.push({seatId:id, since:now()}); return `${who(s)} foi ao banheiro`; }, {icon:'door', tone:'wc'});
  } else {
    commit('Fila do banheiro', rr => { rr.wc.queue.push({seatId:id, at:now()}); return `${who(s)} entrou na fila (${rr.wc.queue.length}º)`; }, {icon:'door', tone:'wc'});
  }
  flash(id, 'flash'); haptic(10);
}
function wcReturn(id){
  const r = room(), s = seatOf(id); if (!s) return;
  const o = r.wc.out.find(x => x.seatId === id); if (!o) return;
  let sentNext = null;
  commit('Voltou do banheiro', rr => {
    wcDrop(rr, id);
    let msg = `${who(s)} voltou · ${durShort(now() - o.since)}`;
    if (S().autoNext && rr.wc.queue.length && rr.wc.out.length < S().wcMax){
      const q = rr.wc.queue.shift(); rr.wc.out.push({seatId:q.seatId, since:now()}); sentNext = q.seatId;
      const ns = seatOf(q.seatId, rr); msg += ` · ${ns ? who(ns) : 'próximo'} liberado`;
    }
    return msg;
  }, {icon:'logIn', tone:'wc', toast:false});
  const rr = room(), next = rr.wc.queue[0], canSend = next && rr.wc.out.length < S().wcMax;
  const acts = canSend ? [{label:`Liberar ${seatOf(next.seatId, rr)?.n ?? ''}`, fn:wcNext}] : [];
  toast(`${who(s)} voltou · ${durShort(now() - o.since)}${sentNext ? ` · ${who(seatOf(sentNext, rr))} liberado` : ''}`, {icon:'logIn', tone:'wc', key:'undo', actions:[...acts, {label:'Desfazer', fn:undo}]});
  flash(id, 'flash'); if (sentNext) flash(sentNext, 'flash'); haptic(10);
}
function wcNext(){

  const r = room(); let {x, y} = viewCenterRaw(); x = Math.round(x); y = Math.round(y);
  for (let tries = 0; tries < 60 && r.seats.some(o => Math.abs(o.x - x) < SW * .85 && Math.abs(o.y - y) < SH * .85); tries++){
    x += SW + 22; if (tries % 6 === 5){ x -= (SW + 22) * 6; y += SH + 22; }

function guessGrid(r){
  const rows = rowsOf(r.seats);
  return {rows:clamp(rows.length || 6, 1, 20), cols:clamp(Math.max(0, ...rows.map(x => x.items.length)) || 5, 1, 20), aisle:0, spacing:'normal'};
}
function applyGrid(d){
  commit('Organizar em grade', r => {
    const pos = gridPositions(d.rows, d.cols, d.aisle, d.spacing);
    const seats = r.seats.slice().sort(bySeatN), keep = seats.slice(0, pos.length), extra = seats.slice(pos.length);
    const extraKeep = extra.filter(hasData), removed = new Set(extra.filter(s => !hasData(s)).map(s => s.id));
    keep.forEach((s, i) => { s.x = pos[i].x; s.y = pos[i].y; });
    let maxN = Math.max(0, ...r.seats.map(s => s.n));
    for (let i = keep.length; i < pos.length; i++) r.seats.push(makeSeat(++maxN, pos[i].x, pos[i].y));
    if (extraKeep.length){
      const lastY = Math.max(...pos.map(p => p.y)), xs = [...new Set(pos.map(p => p.x))].sort((a, b) => a - b), gy = (GAPS[d.spacing] || GAPS.normal)[1];
      extraKeep.forEach((s, i) => { s.x = xs[i % xs.length]; s.y = lastY + (SH + gy) * (1 + Math.floor(i / xs.length)); });
    }
    r.seats = r.seats.filter(s => !removed.has(s.id));
    r.wc.queue = r.wc.queue.filter(q => !removed.has(q.seatId)); r.wc.out = r.wc.out.filter(o => !removed.has(o.seatId));
    renumberRoom(r);
    return `Sala organizada em ${d.rows} × ${d.cols}` + (extraKeep.length ? ` (+${extraKeep.length} em fileira extra)` : '');
  }, {icon:'grid'});
  closeSheet(); setTimeout(() => fit(true), 60);
}

/* ---------- Lista de alunos ---------- */
function parseList(text, defTurma, fmt){
  let lines = String(text || '').split(/\r?\n/).map(l => l.trim()).filter(Boolean);
  if (lines.length && /^(nome|aluno|estudante)s?\b/i.test(lines[0]) && /[;\t,]|turma/i.test(lines[0])) lines.shift();
  return lines.map(line => {
    line = line.replace(/^\d{1,3}\s*[.)\-–:]?\s+(?=\D)/, '');
    let name = line, turma = '', parts = null;
    if (line.includes('\t')) parts = line.split('\t');
    else if (line.includes(';')) parts = line.split(';');
    else if (/\s[-–—|]\s/.test(line)){ const m = line.match(/^(.*\S)\s+[-–—|]\s+(.*)$/); if (m) parts = [m[1], m[2]]; }
    else if (line.includes(',')){ const i = line.lastIndexOf(','), tail = line.slice(i + 1).trim(); if (tail && tail.length <= 10) parts = [line.slice(0, i), tail]; }
    if (parts){ parts = parts.map(p => p.trim()).filter(Boolean); name = parts[0] || ''; turma = parts[1] || ''; }
    if (turma && name.length <= 6 && turma.length > 6) [name, turma] = [turma, name];
    name = name.replace(/\s+/g, ' ').trim();
    if (fmt && name && (name === name.toUpperCase() || name === name.toLowerCase())) name = titleCase(name);
    return {name, turma:(turma || defTurma || '').trim()};
  }).filter(x => x.name && !/^\d+$/.test(x.name));
}
/* Distribui priorizando que vizinhos sejam de turmas diferentes */
function mixAssign(r, targets, list){
  const targetSet = new Set(targets.map(s => s.id)), groups = new Map();
  list.forEach(st => { const k = norm(st.turma); if (!groups.has(k)) groups.set(k, []); groups.get(k).push(st); });
  groups.forEach(arr => shuffle(arr));
  const res = new Map();
  for (const seat of targets){
    const counts = new Map();
    for (const n of r.seats){
      const w = isNeighbor(seat, n) ? 1000 : isDiagonal(seat, n) ? 3 : 0;
      if (!w) continue;
      const t = res.has(n.id) ? norm(res.get(n.id).turma) : (!targetSet.has(n.id) && n.name ? norm(n.turma) : null);
      if (t !== null) counts.set(t, (counts.get(t) || 0) + w);
    }
    let best = null, bestScore = Infinity;
    for (const [k, arr] of groups){ if (!arr.length) continue; const sc = (counts.get(k) || 0) - arr.length + Math.random() * .5; if (sc < bestScore){ bestScore = sc; best = k; } }
    if (best === null) break;
    res.set(seat.id, groups.get(best).pop());
  }
  return targets.map(s => res.get(s.id));
}
function ensureSeats(r, need){
  const missing = need; if (missing <= 0) return [];
  const rows = rowsOf(r.seats), created = [];
  let xs, y, gy = 22;
  if (rows.length){ const tpl = rows.reduce((a, b) => b.items.length > a.items.length ? b : a); xs = tpl.items.map(s => s.x); y = Math.max(...r.seats.map(s => s.y)) + SH + gy; }
  else { const pos = gridPositions(Math.ceil(missing / 5), 5); let n = 0; for (const p of pos){ if (n >= missing) break; const s = makeSeat(++n, p.x, p.y); r.seats.push(s); created.push(s); } return created; }
  let maxN = Math.max(0, ...r.seats.map(s => s.n));
  for (let i = 0; i < missing; i++){ const s = makeSeat(++maxN, xs[i % xs.length], y + Math.floor(i / xs.length) * (SH + gy)); r.seats.push(s); created.push(s); }
  return created;
}
function clearStudent(s){ s.name = ''; s.turma = ''; s.status = 'present'; s.statusAt = null; s.doneAt = null; s.warns = []; s.note = ''; }
function distribute(list, order, fill, extra){
  if (!list.length){ toast('Cole pelo menos um nome', {icon:'users', key:'undo'}); return; }
  commit('Distribuir alunos', r => {
    if (fill === 'replace'){ r.seats.forEach(clearStudent); r.wc = {out:[], queue:[], hist:r.wc.hist}; }
    let targets = byPosition(r.seats).filter(s => !s.name.trim());
    if (extra && list.length > targets.length){ ensureSeats(r, list.length - targets.length); targets = byPosition(r.seats).filter(s => !s.name.trim()); }
    const items = list.slice(0, targets.length).map(x => ({...x}));
    const use = targets.slice(0, items.length);
    let assigned;
    if (order === 'mix') assigned = mixAssign(r, use, items);
    else if (order === 'random') assigned = shuffle(items);
    else assigned = items;
    use.forEach((s, i) => { const st = assigned[i]; if (st){ s.name = st.name; s.turma = st.turma; } });
    const left = list.length - use.length;
    return `${plural(use.length, 'aluno distribuído', 'alunos distribuídos')}` + (left > 0 ? ` · ${left} sem lugar` : '');
  }, {icon:'users', tone:'ok'});
  setTimeout(() => fit(true), 60);
}
function reshuffle(order){
  const r = room(); const studs = r.seats.filter(s => s.name.trim());
  if (studs.length < 2){ toast('Precisa de pelo menos 2 alunos com nome', {icon:'users', key:'undo'}); return; }
  commit(order === 'mix' ? 'Intercalar turmas' : 'Sortear lugares', rr => {
    const data = studs.map(s => ({from:s.id, name:s.name, turma:s.turma, status:s.status, statusAt:s.statusAt, doneAt:s.doneAt, warns:s.warns, note:s.note}));
    rr.seats.forEach(clearStudent);
    const targets = byPosition(rr.seats).slice(0, data.length);
    const assigned = order === 'mix' ? mixAssign(rr, targets, data) : shuffle(data.slice());
    const map = new Map();
    targets.forEach((s, i) => { const d = assigned[i]; if (!d) return; Object.assign(s, {name:d.name, turma:d.turma, status:d.status, statusAt:d.statusAt, doneAt:d.doneAt, warns:d.warns, note:d.note}); map.set(d.from, s.id); });
    rr.wc.out.forEach(o => o.seatId = map.get(o.seatId) || o.seatId); rr.wc.queue.forEach(q => q.seatId = map.get(q.seatId) || q.seatId);
    return order === 'mix' ? 'Lugares sorteados intercalando as turmas' : 'Lugares sorteados';
  }, {icon:'shuffle', tone:'ok'});
}

/* ---------- Prova (cronômetro) ---------- */
const examDraft = {at:'', all:false};
function examStart(){
  let at = examDraft.at ? timeToday(examDraft.at) : now();
  if (!at) at = now();
  if (at > now() + 60000){ toast('Horário no futuro — iniciando agora', {icon:'clock', key:'hint'}); at = now(); }
  if (now() - at > 12 * 3600000) at = now();
  const all = examDraft.all && state.rooms.length > 1;
  commit('Iniciar prova', r => {
    const src = r.exam;
    (all ? state.rooms : [r]).forEach(rr => {
      if (rr !== r) rr.exam = {...rr.exam, title:src.title, duration:src.duration, minStay:src.minStay};
      rr.exam.startAt = at; rr.exam.endedAt = null; rr.exam.extra = 0;
    });
    return `Prova iniciada às ${hhmm(at)}${all ? ' em todas as salas' : ''} · termina ${hhmm(examEndAt(r.exam))}`;
  }, {icon:'play', tone:'ok'});
  examDraft.at = ''; examDraft.all = false; syncWake();
}
function examExtra(m){
  commit('Ajustar tempo', r => { const ex = r.exam; const nx = clamp(ex.extra + m, -ex.duration + 1, 600); if (nx === ex.extra) return false; ex.extra = nx; return `${m > 0 ? '+' : '−'}${Math.abs(m)} min · termina às ${hhmm(examEndAt(ex))}`; }, {icon:'timer'});
}

  commit('Encerrar prova', r => { r.exam.endedAt = now(); return `Prova encerrada às ${hhmm(now())}`; }, {icon:'stop', actions:[{label:'Relatório', fn:() => openSheet('report')}]});

}
