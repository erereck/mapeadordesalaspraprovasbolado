function renderStats(){
  const r = room(), st = stats(r), t = now(), lim = S().wcLimit * 60000, parts = [examChip(r, t)];
  parts.push(`<button class="stat${st.absent ? '' : ''}" data-act="open" data-sheet="students">${ic('users')}<span>Presentes</span><b>${st.present}/${st.total}</b>${st.absent ? `<em>${st.absent} ausente${st.absent > 1 ? 's' : ''}</em>` : ''}</button>`);
  parts.push(`<button class="stat${st.warns ? ' warn' : ''}" data-act="open" data-sheet="log" data-f="warn">${ic('alert')}<b>${st.warns}</b><span>advertência${st.warns === 1 ? '' : 's'}</span>${st.atLimit ? `<em class="bad">${st.atLimit} no limite</em>` : ''}</button>`);
  const out = r.wc.out; let wcHtml, over = false;
  if (out.length){
    over = out.some(o => t - o.since >= lim);
    wcHtml = out.map(o => { const s = seatOf(o.seatId); return `<span>Cad. ${s ? s.n : '?'}</span><b class="live" data-since="${o.since}">${dur(t - o.since)}</b>`; }).join('<span>·</span>');
  } else wcHtml = '<span>Banheiro livre</span>';
  parts.push(`<button class="stat wc${out.length ? ' busy' : ''}${over ? ' over' : ''}" data-act="open" data-sheet="wc">${ic('door')}${wcHtml}${r.wc.queue.length ? `<em>fila ${r.wc.queue.length}</em>` : ''}</button>`);
  parts.push(`<button class="stat${st.done + st.taken ? ' ok' : ''}" data-act="mode" data-v="done">${ic('fileCheck')}<span>Entregaram</span><b>${st.done + st.taken}/${st.present}</b></button>`);
  const nt = turmasOf(r).length;
  if (nt){ const pairs = S().lens === 'turmas' ? conflicts(r).pairs : 0; parts.push(`<button class="stat${S().lens === 'turmas' ? ' on' : ''}" data-act="lens">${ic('palette')}<b>${nt}</b><span>turma${nt > 1 ? 's' : ''}</span>${pairs ? `<em class="bad">${pairs} vizinhos iguais</em>` : ''}</button>`); }
  statsEl.innerHTML = parts.join('');
  focusPill.innerHTML = `<button class="iconbtn sm ghost" data-act="focus" aria-label="Sair da tela limpa">${ic('minimize')}</button>${examChip(r, t)}`;
}
function renderDock(){
  app.dataset.mode = mode;
  dockEl.innerHTML = MODES.map((m, i) => `<button class="mode${m.id === mode ? ' on' : ''}" data-act="mode" data-v="${m.id}" style="--mc:var(--m-${m.id})" aria-pressed="${m.id === mode}" title="${m.label} (${i + 1})">${ic(m.icon)}<span>${m.label}</span></button>`).join('');
}
function renderCtx(){
  const r = room(), st = stats(r), set = S(), t = now(); let h = '';
  if (swapFrom){
    const s = seatOf(swapFrom);
    h = `<div class="ctx-row"><span class="ctx-hint">${ic('swap')}<span>Trocando <b>Cad. ${s ? s.n : ''}${s && s.name ? ' · ' + esc(shortName(s.name)) : ''}</b> — toque no novo lugar</span></span><span class="sp"></span><button class="btn sm" data-act="swapCancel">Cancelar</button></div>`;
  } else if (mode === 'warn'){
    h = `<div class="ctx-row"><span class="ctx-hint">${ic('alert')}Motivo</span>` + ['', ...set.warnTypes].map(tp => `<button class="chip warnc${tp === warnType ? ' on' : ''}" data-act="wtype" data-v="${esc(tp)}">${tp ? esc(tp) : 'Geral'}</button>`).join('') + '</div>';
  } else if (mode === 'presence'){
    h = `<div class="ctx-row"><span class="ctx-hint">${ic('userCheck')}Toque = ausente / presente</span><span class="sp"></span><span class="ctx-num"><b>${st.present}</b>/${st.total}</span><button class="btn sm" data-act="allPresent">Todos presentes</button></div>`;
  } else if (mode === 'done'){
    const ea = exitAt(r.exam), running = examState(r.exam) === 'running';
    const ex = ea && running ? (t < ea ? `<span class="pill amber">${ic('clock')}Saída às ${hhmm(ea)}</span>` : `<span class="pill ok">${ic('check')}Saída liberada</span>`) : '';
    h = `<div class="ctx-row"><span class="ctx-hint">${ic('fileCheck')}Toque quando entregar</span>${ex}<span class="sp"></span><span class="ctx-num"><b>${st.done + st.taken}</b>/${st.present}</span></div>`;
  } else if (mode === 'wc'){
    const lim = set.wcLimit * 60000;
    const outs = r.wc.out.map(o => { const s = seatOf(o.seatId); return `<div class="wcpill${t - o.since >= lim ? ' over' : ''}"><span>Cad. <b>${s ? s.n : '?'}</b></span><b class="live" data-since="${o.since}">${dur(t - o.since)}</b><button class="btn sm wc" data-act="wcBack" data-id="${o.seatId}">${ic('check')}Voltou</button></div>`; }).join('');
    const next = r.wc.queue[0], canSend = next && r.wc.out.length < set.wcMax;
    h = `<div class="ctx-row">${outs || `<span class="ctx-hint">${ic('door')}Banheiro livre</span>`}`
      + (r.wc.queue.length ? `<span class="pill wc">Fila: ${r.wc.queue.slice(0, 6).map(q => seatOf(q.seatId)?.n ?? '?').join(' · ')}${r.wc.queue.length > 6 ? '…' : ''}</span>` : '')
      + (canSend ? `<button class="btn sm primary" data-act="wcNext">Liberar ${seatOf(next.seatId)?.n ?? ''}</button>` : '')
      + `<span class="sp"></span><button class="iconbtn sm" data-act="open" data-sheet="wc" aria-label="Painel do banheiro">${ic('list')}</button></div>`;
  } else if (mode === 'edit'){
    h = `<div class="ctx-row"><button class="btn sm primary" data-act="addSeat">${ic('plus')}Cadeira</button><button class="btn sm" data-act="open" data-sheet="grid">${ic('grid')}Grade</button><button class="btn sm" data-act="renumber">${ic('hash')}Numerar</button><button class="btn sm" data-act="flip">${ic('rotate')}Girar</button><button class="btn sm${set.snap ? ' on' : ''}" data-act="snapT">${ic('magnet')}Ímã</button><button class="btn sm" data-act="open" data-sheet="students" data-tab="import">${ic('users')}Alunos</button></div>`;
  }
  ctxEl.hidden = !h;
  if (h && ctxEl._h !== h){ ctxEl.innerHTML = h; ctxEl._h = h; }
  if (!h) ctxEl._h = '';
}

/* ============================================================
   SHEETS (painéis)
   ============================================================ */
const SH_ = {};
function openSheet(name, p = {}){
  if (!SH_[name]) return;
  const was = !!sheet;
  sheet = {name, p:{...p}};
  scrim.classList.add('on'); app.classList.add('has-sheet');
  renderSheet(true);
  sheetEl.classList.remove('closing');
  if (!was){ void sheetEl.offsetWidth; sheetEl.classList.add('on'); }
  if (name === 'seat') renderMap();
}
function closeSheet(){
  if (!sheet) return;
  const was = sheet; sheet = null;
  sheetEl.classList.remove('on'); sheetEl.classList.add('closing'); scrim.classList.remove('on'); app.classList.remove('has-sheet');
  setTimeout(() => { if (!sheet) sheetEl.classList.remove('closing'); }, 320);
  if (document.activeElement && sheetEl.contains(document.activeElement)) document.activeElement.blur();
  if (was.name === 'seat') renderMap();
}
function renderSheet(first){
  if (!sheet) return;
  const out = SH_[sheet.name](sheet.p);
  if (!out){ closeSheet(); return; }
  const ae = document.activeElement, fk = ae && sheetEl.contains(ae) ? ae.dataset.k : null;
  let s0 = null, s1 = null; if (fk){ try { s0 = ae.selectionStart; s1 = ae.selectionEnd; } catch (_) {} }
  const st = sheetBody.scrollTop;
  sheetEl.dataset.name = sheet.name;
  sheetHead.innerHTML = `${out.badge || `<div class="sh-ic ${out.tone || ''}">${ic(out.icon || 'list')}</div>`}<div class="sh-t"><div class="sheet-title" id="sheetTitle">${out.title}</div>${out.sub ? `<div class="sheet-sub">${out.sub}</div>` : ''}</div>${out.extra || ''}<button class="iconbtn sm" data-act="closeSheet" aria-label="Fechar" title="Fechar (Esc)">${ic('x')}</button>`;
  sheetBody.innerHTML = out.body;
  sheetFoot.innerHTML = out.foot || ''; sheetFoot.hidden = !out.foot;
  sheetBody.scrollTop = first ? 0 : st;
  if (fk){ const el = sheetEl.querySelector(`[data-k="${fk}"]`); if (el){ el.focus({preventScroll:true}); try { if (s0 != null) el.setSelectionRange(s0, s1); } catch (_) {} } }
  if (first && out.focus) setTimeout(() => { const el = sheetEl.querySelector(out.focus); if (el && sheet){ el.focus(); try { el.select(); } catch (_) {} } }, isDesktop() ? 60 : 320);
}
/* arrastar a alça para fechar (celular) */
sheetTop.addEventListener('pointerdown', e => {
  if (isDesktop() || e.target.closest('button, input')) return;
  const y0 = e.clientY; let dy = 0; sheetEl.style.transition = 'none';
  const mv = ev => { dy = Math.max(0, ev.clientY - y0); sheetEl.style.translate = `0 ${dy}px`; };
  const up = () => { window.removeEventListener('pointermove', mv); window.removeEventListener('pointerup', up); window.removeEventListener('pointercancel', up); sheetEl.style.transition = ''; sheetEl.style.translate = ''; if (dy > 90) closeSheet(); };
  window.addEventListener('pointermove', mv); window.addEventListener('pointerup', up); window.addEventListener('pointercancel', up);
});

const statusAv = (s, lvl) => s.status === 'absent' ? 'abs' : (lvl ? 'l' + lvl : s.status === 'done' ? 'ok' : '');
const stuRowHTML = (s, r) => {
  const c = s.warns.length, lvl = warnLevel(c), wi = wcInfo(r, s.id);
  const bits = [s.turma ? esc(s.turma) : '', STATUS[s.status] + (s.doneAt && (s.status === 'done' || s.status === 'taken') ? ' ' + hhmm(s.doneAt) : ''), wi ? (wi.type === 'out' ? 'no banheiro' : `fila ${wi.pos}º`) : ''].filter(Boolean).join(' · ');
  return `<button class="li" data-act="openSeat" data-id="${s.id}"><span class="av ${statusAv(s, lvl)}">${s.n}</span><span class="mid"><b>${s.name ? esc(s.name) : '<span style="color:var(--muted)">Sem nome</span>'}</b><small>${bits}</small></span>${c ? `<span class="sw l${lvl}">${ic('alert')}${c}</span>` : ''}</button>`;
};

/* ---------- Cadeira ---------- */
SH_.seat = p => {
  const r = room(), s = seatOf(p.id); if (!s) return null;
  const set = S(), c = s.warns.length, L = set.warnLimit, wi = wcInfo(r, s.id), lvl = warnLevel(c);
  const sorted = r.seats.slice().sort(bySeatN), idx = sorted.indexOf(s), prev = sorted[idx - 1], next = sorted[idx + 1];
  let wcL, wcS;
  if (wi && wi.type === 'out'){ wcL = 'Voltou'; wcS = `fora há <b class="live" data-since="${wi.since}">${dur(now() - wi.since)}</b>`; }
  else if (wi && wi.type === 'queue'){ wcL = `Na fila · ${wi.pos}º`; wcS = 'toque para remover'; }
  else { const free = r.wc.out.length < set.wcMax && !r.wc.queue.length; wcL = 'Banheiro'; wcS = free ? 'liberar agora' : `entrar na fila (${r.wc.queue.length + 1}º)`; }
  const turmas = turmasOf(r);
  return {
    title:`Cadeira ${s.n}`,
    sub:s.name ? esc(s.name) + (s.turma ? ` · ${esc(s.turma)}` : '') : (s.turma ? esc(s.turma) : 'Sem aluno definido'),
    badge:`<div class="seat-badge l${lvl} st-${s.status}">${s.n}</div>`,
    extra:`<button class="iconbtn sm" data-act="openSeat" data-id="${prev ? prev.id : ''}" ${prev ? '' : 'disabled'} aria-label="Cadeira anterior" title="Anterior">${ic('chevL')}</button><button class="iconbtn sm" data-act="openSeat" data-id="${next ? next.id : ''}" ${next ? '' : 'disabled'} aria-label="Próxima cadeira" title="Próxima">${ic('chevR')}</button>`,
    body:`
      <div class="seg status" role="radiogroup" aria-label="Situação">${Object.entries(STATUS).map(([k, v]) => `<button class="${s.status === k ? 'on' : ''}" data-act="setStatus" data-id="${s.id}" data-v="${k}" role="radio" aria-checked="${s.status === k}">${v}</button>`).join('')}</div>
      <div class="bigacts">
        <button class="bigbtn warn${lvl === 3 ? ' l3' : ''}" data-act="warnSeat" data-id="${s.id}"><span class="bi">${ic('alert')}</span><span><b>Advertir</b><small>${c}/${L} advertências</small></span></button>
        <button class="bigbtn wc ${wi ? wi.type : ''}" data-act="wcSeat" data-id="${s.id}"><span class="bi">${ic('door')}</span><span><b>${wcL}</b><small>${wcS}</small></span></button>
      </div>
      <div class="sec-label">Advertir com motivo</div>
      <div class="chips wrap">${set.warnTypes.map(tp => `<button class="chip" data-act="warnSeat" data-id="${s.id}" data-type="${esc(tp)}">${ic('plus')}${esc(tp)}</button>`).join('')}</div>
      ${c ? `<div class="sec-label">Advertências <span class="count l${lvl}">${c} de ${L}</span></div><div class="wbar l${lvl}"><i style="width:${Math.min(100, c / L * 100)}%"></i></div>
      <div class="list">${s.warns.map((w, i) => `<div class="li sm"><span class="av sm l${warnLevel(i + 1)}">${i + 1}ª</span><span class="mid"><b>${esc(w.type || 'Advertência')}</b><small>${w.t ? 'às ' + hhmm(w.t) : 'sem horário (versão antiga)'}</small></span><button class="iconbtn sm ghost" data-act="delWarn" data-id="${s.id}" data-w="${w.id}" aria-label="Remover advertência" title="Remover">${ic('x')}</button></div>`).join('')}</div>` : ''}
      <div class="sec-label">Aluno</div>
      <label class="field"><span>Nome</span><input data-in="seatName" data-k="seatName" data-id="${s.id}" value="${esc(s.name)}" placeholder="Nome do aluno" autocomplete="off" autocapitalize="words" enterkeyhint="next" maxlength="80"></label>
      <label class="field"><span>Turma</span><input data-in="seatTurma" data-k="seatTurma" data-id="${s.id}" value="${esc(s.turma)}" placeholder="Ex.: 2°A" list="dlTurmas" autocomplete="off" enterkeyhint="next" maxlength="20"></label>
      ${turmas.length ? `<div class="chips" style="margin-top:8px">${turmas.map(t => `<button class="chip tmchip${t === s.turma.trim() ? ' on' : ''}" style="--h:${H.get(t)}" data-act="setTurma" data-id="${s.id}" data-v="${esc(t)}">${esc(t)}</button>`).join('')}</div>` : ''}
      <label class="field"><span>Observação</span><textarea data-in="seatNote" data-k="seatNote" data-id="${s.id}" rows="2" placeholder="Ex.: chegou atrasado, prova adaptada, sala de apoio…" maxlength="400">${esc(s.note)}</textarea></label>
      <p class="hint"><b>Enter</b> no nome ou turma vai para a próxima cadeira — rápido para digitar a turma inteira.</p>
      <div class="row" style="margin-top:14px"><button class="btn grow" data-act="swapStart" data-id="${s.id}">${ic('swap')}Trocar de lugar</button><button class="btn grow" data-act="locate" data-id="${s.id}">${ic('fit')}Localizar</button></div>
      <button class="btn danger block" style="margin-top:8px" data-act="delSeat" data-id="${s.id}">${ic('trash')}Excluir cadeira</button>`
  };
};

/* ---------- Banheiro ---------- */
SH_.wc = () => {
  const r = room(), set = S(), t = now(), lim = set.wcLimit * 60000;
  const outs = r.wc.out.map(o => { const s = seatOf(o.seatId), over = t - o.since >= lim; return `<div class="wcnow${over ? ' over' : ''}"><span class="av wc">${s ? s.n : '?'}</span><span class="mid"><b>${s ? (s.name ? esc(s.name) : 'Cadeira ' + s.n) : 'Aluno'}</b><small>${s && s.turma ? esc(s.turma) + ' · ' : ''}saiu às ${hhmm(o.since)}${over ? ' · passou do tempo' : ''}</small></span><span class="wc-t live" data-since="${o.since}">${dur(t - o.since)}</span></div><button class="btn wc block" style="margin-bottom:10px" data-act="wcBack" data-id="${o.seatId}">${ic('logIn')}Voltou</button>`; }).join('');
  const canSend = r.wc.queue.length && r.wc.out.length < set.wcMax;
  const free = r.wc.out.length < set.wcMax ? `<div class="wcnow free"><span class="av">${ic('door')}</span><span class="mid"><b>${r.wc.out.length ? 'Ainda há vaga' : 'Banheiro livre'}</b><small>${r.wc.queue.length ? 'Libere o próximo da fila' : 'Ninguém esperando'}</small></span>${canSend ? `<button class="btn primary" data-act="wcNext">Liberar Cad. ${seatOf(r.wc.queue[0].seatId)?.n ?? ''}</button>` : ''}</div>` : '';
  const queue = r.wc.queue.length ? `<div class="list">${r.wc.queue.map((q, i) => { const s = seatOf(q.seatId); return `<div class="li sm"><span class="av sm wc">${i + 1}º</span><span class="mid"><b>Cad. ${s ? s.n : '?'}${s && s.name ? ' · ' + esc(shortName(s.name)) : ''}</b><small>esperando <span class="live" data-since="${q.at}">${dur(t - q.at)}</span></small></span>${i ? `<button class="iconbtn sm ghost" data-act="wcUp" data-id="${q.seatId}" aria-label="Subir na fila">${ic('arrowUp')}</button>` : ''}<button class="iconbtn sm ghost" data-act="wcRm" data-id="${q.seatId}" aria-label="Remover da fila">${ic('x')}</button></div>`; }).join('')}</div>` : `<div class="empty">Ninguém na fila.</div>`;
  const nums = r.seats.slice().sort(bySeatN).map(s => { const wi = wcInfo(r, s.id), blocked = s.status !== 'present' || (wi && wi.type === 'out'); return `<button class="${wi && wi.type === 'queue' ? 'q' : ''}" data-act="wcSeat" data-id="${s.id}" ${blocked ? 'disabled' : ''} title="${s.name ? esc(s.name) : 'Cadeira ' + s.n}">${s.n}</button>`; }).join('');
  const hist = r.wc.hist.slice().reverse();
  const histHTML = hist.length ? `<div class="list">${hist.map(h => { const d = (h.back || t) - h.out, over = d >= lim; return `<div class="li sm"><span class="av sm ${over ? 'l3' : ''}">${h.n ?? '?'}</span><span class="mid"><b>${h.name ? esc(shortName(h.name)) : 'Cadeira ' + (h.n ?? '?')}</b><small>${hhmm(h.out)} → ${h.back ? hhmm(h.back) : '…'} · ${durShort(d)}${over ? ' · acima do limite' : ''}</small></span></div>`; }).join('')}</div>` : `<div class="empty">Nenhuma ida registrada.</div>`;
  return {title:'Banheiro', icon:'door', tone:'wc', sub:`Limite ${set.wcLimit} min · ${set.wcMax} por vez · ${plural(r.wc.hist.length + r.wc.out.length, 'ida', 'idas')}`,
    body:`${outs}${free}
      <div class="sec-label">Fila <span class="count">${r.wc.queue.length}</span></div>${queue}
      <div class="sec-label">Toque no número da cadeira</div><div class="numgrid">${nums || '<div class="empty">Sem cadeiras</div>'}</div>
      <p class="hint">Se o banheiro estiver livre, o aluno sai na hora; senão entra na fila. A ordem é a dos toques.</p>
      <div class="sec-label">Regras</div>
      <div class="setrow"><span class="mid"><b>Tempo máximo</b><small>Alerta e destaque vermelho depois disso</small></span>${stepper('wcLimit', set.wcLimit, ' min')}</div>
      <div class="setrow"><span class="mid"><b>Pessoas ao mesmo tempo</b><small>Quantos podem estar fora juntos</small></span>${stepper('wcMax', set.wcMax, '')}</div>
      <label class="setrow"><span class="mid"><b>Liberar o próximo automaticamente</b><small>Quando alguém volta, o 1º da fila já sai</small></span><input type="checkbox" class="switch" data-ch="set" data-f="autoNext" ${set.autoNext ? 'checked' : ''}></label>
      <div class="sec-label">Histórico <span class="count">${hist.length}</span></div>${histHTML}`};
};
const stepper = (f, v, suf) => `<div class="stepper"><button data-act="step" data-f="${f}" data-d="-1" aria-label="Diminuir">${ic('minus')}</button><output>${v}${suf}</output><button data-act="step" data-f="${f}" data-d="1" aria-label="Aumentar">${ic('plus')}</button></div>`;

/* ---------- Prova ---------- */
SH_.exam = () => {
  const r = room(), ex = r.exam, es = examState(ex), t = now();
  const durs = [60, 90, 120, 150, 180, 240, 300], stays = [0, 30, 45, 60, 90, 120];
  const fmtMin = m => m >= 60 ? `${Math.floor(m / 60)}h${m % 60 ? pad2(m % 60) : ''}` : `${m} min`;
  const cfg = `
    <label class="field"><span>Nome da prova</span><input data-in="exTitle" data-k="exTitle" value="${esc(ex.title)}" placeholder="Ex.: Simulado — Matemática" maxlength="80"></label>
    <label class="field"><span>Fiscal / aplicador</span><input data-in="exProctor" data-k="exProctor" value="${esc(ex.proctor)}" placeholder="Seu nome (vai no relatório)" maxlength="60"></label>
    <div class="sec-label">Duração</div>
    <div class="chips wrap">${durs.map(d => `<button class="chip${ex.duration === d ? ' on' : ''}" data-act="exDur" data-v="${d}">${fmtMin(d)}</button>`).join('')}</div>
    <label class="field"><span>Outra duração (minutos)</span><input type="number" inputmode="numeric" min="5" max="720" data-ch="exDurN" value="${ex.duration}"></label>
    <div class="sec-label">Tempo mínimo para sair</div>
    <div class="chips wrap">${stays.map(d => `<button class="chip${ex.minStay === d ? ' on' : ''}" data-act="exMin" data-v="${d}">${d ? fmtMin(d) : 'Livre'}</button>`).join('')}</div>
    <p class="hint">Antes desse tempo o app pede confirmação para registrar entregas e avisa quando a saída for liberada.</p>`;
  let top = '', foot = '';
  if (es === 'idle'){
    const startDef = examDraft.at || hhmm(t);
    top = `<div class="exam-big"><div class="lbl">Duração</div><div class="t">${fmtMin(ex.duration)}</div><div class="meta">Se começar agora, termina às <b>${hhmm(t + ex.duration * 60000)}</b>${ex.minStay ? ` · saída a partir de ${hhmm(t + ex.minStay * 60000)}` : ''}</div></div>
      <div class="grid2" style="margin-top:12px"><label class="field" style="margin:0"><span>Começou às</span><input type="time" data-in="exAt" value="${startDef}"></label>
      ${state.rooms.length > 1 ? `<label class="setrow" style="border:0;padding:20px 2px 0"><span class="mid"><b>Todas as salas</b></span><input type="checkbox" class="switch" data-ch="exAll" ${examDraft.all ? 'checked' : ''}></label>` : '<span></span>'}</div>`;
    foot = `<button class="btn primary block" data-act="examStart">${ic('play')}Iniciar prova</button>`;
  } else if (es === 'running'){
    const end = examEndAt(ex), rem = end - t, tot = (ex.duration + ex.extra) * 60000, ea = exitAt(ex);
    top = `<div class="exam-big ${examPhase(ex, t)}" id="examBig"><div class="lbl">${rem > 0 ? 'Tempo restante' : 'Tempo esgotado há'}</div><div class="t exam-live">${rem > 0 ? dur(rem) : dur(-rem)}</div>
      <div class="pbar"><i class="exam-bar" style="width:${clamp(1 - rem / tot, 0, 1) * 100}%"></i></div>

/* ---------- Ocorrências / linha do tempo ---------- */
let logF = 'all';
function timeline(r){
  const ev = [];
  for (const s of r.seats){
    s.warns.forEach((w, i) => ev.push({t:w.t, k:'warn', s, w, i:i + 1}));
    if ((s.status === 'done' || s.status === 'taken') && s.doneAt) ev.push({t:s.doneAt, k:s.status, s});
    if (s.status === 'absent') ev.push({t:s.statusAt, k:'absent', s});
  }
  r.wc.hist.forEach(h => { ev.push({t:h.out, k:'wcout', h}); if (h.back) ev.push({t:h.back, k:'wcback', h}); });
  r.wc.out.forEach(o => { const s = seatOf(o.seatId, r); ev.push({t:o.since, k:'wcout', h:{seatId:o.seatId, n:s ? s.n : null, name:s ? s.name : '', out:o.since}, live:true}); });
  r.notes.forEach(n => ev.push({t:n.t, k:'note', note:n}));
  if (r.exam.startAt) ev.push({t:r.exam.startAt, k:'start'});
  if (r.exam.endedAt) ev.push({t:r.exam.endedAt, k:'end'});
  return ev.sort((a, b) => (b.t || 0) - (a.t || 0));
}
function evHTML(e){
  const seatBtn = id => id ? `data-act="locate" data-id="${id}"` : '';
  const T = e.t ? hhmm(e.t) : '—';
  const row = (icon, tone, title, sub, act, extra = '') => `<div class="tl-i" ${act || ''} role="${act ? 'button' : ''}" style="${act ? 'cursor:pointer' : ''}"><span class="tl-t">${T}</span><span class="tl-ic ${tone}">${ic(icon)}</span><span class="mid"><b>${title}</b>${sub ? `<small>${sub}</small>` : ''}</span>${extra}</div>`;
  switch (e.k){
    case 'warn': return row('alert', e.i >= S().warnLimit ? 'red' : 'warn', `${who(e.s)} · ${e.i}ª advertência`, esc(e.w.type || 'Geral') + (e.s.turma ? ' · ' + esc(e.s.turma) : ''), seatBtn(e.s.id), `<button class="iconbtn sm ghost" data-act="delWarn" data-id="${e.s.id}" data-w="${e.w.id}" aria-label="Remover">${ic('x')}</button>`);
    case 'done': return row('fileCheck', 'ok', `${who(e.s)} entregou`, e.s.turma ? esc(e.s.turma) : '', seatBtn(e.s.id));
    case 'taken': return row('flag', 'red', `${who(e.s)} · prova recolhida`, e.s.warns.length ? plural(e.s.warns.length, 'advertência', 'advertências') : '', seatBtn(e.s.id));
    case 'absent': return row('userX', 'pr', `${who(e.s)} ausente`, '', seatBtn(e.s.id));
    case 'wcout': return row('door', 'wc', `Cad. ${e.h.n ?? '?'}${e.h.name ? ' · ' + esc(shortName(e.h.name)) : ''} saiu para o banheiro`, e.live ? `fora há <span class="live" data-since="${e.h.out}">${dur(now() - e.h.out)}</span>` : '', seatBtn(e.h.seatId));
    case 'wcback': { const d = e.h.back - e.h.out; return row('logIn', d >= S().wcLimit * 60000 ? 'red' : 'wc', `Cad. ${e.h.n ?? '?'}${e.h.name ? ' · ' + esc(shortName(e.h.name)) : ''} voltou`, `ficou ${durShort(d)} fora`, seatBtn(e.h.seatId)); }
    case 'note': { const s = e.note.n != null ? room().seats.find(x => x.n === e.note.n) : null; return row('note', 'acc', esc(e.note.text), e.note.n != null ? `Cadeira ${e.note.n}${s && s.name ? ' · ' + esc(s.name) : ''}` : 'Ocorrência geral', s ? seatBtn(s.id) : '', `<button class="iconbtn sm ghost" data-act="delNote" data-id="${e.note.id}" aria-label="Apagar">${ic('x')}</button>`); }
    case 'start': return row('play', 'acc', 'Início da prova', '', '');
    case 'end': return row('stop', 'acc', 'Prova encerrada', '', '');
  }
  return '';
}
SH_.log = p => {

let searchQ = '';
function searchHTML(){
  const q = norm(searchQ);
  const res = [];
  for (const r of state.rooms) for (const s of r.seats){
    if (!q) { if (r === room() && s.name) res.push({r, s}); continue; }
    const num = q.replace(/^#/, '');
    if (norm(s.name).includes(q) || norm(s.turma) === q || (/^\d+$/.test(num) && String(s.n) === num && r === room())) res.push({r, s});
  }
  if (!res.length) return `<div class="empty">${ic('search')}${q ? 'Nada encontrado.' : 'Nenhum aluno com nome nesta sala.'}</div>`;
  return `<div class="list">${res.slice(0, 60).map(({r, s}) => { const c = s.warns.length, lvl = warnLevel(c); return `<button class="li" data-act="goSeat" data-room="${r.id}" data-id="${s.id}"><span class="av ${statusAv(s, lvl)}">${s.n}</span><span class="mid"><b>${s.name ? esc(s.name) : 'Cadeira ' + s.n}</b><small>${[r.id !== state.active ? esc(r.name) : '', s.turma ? esc(s.turma) : '', STATUS[s.status]].filter(Boolean).join(' · ')}</small></span>${c ? `<span class="sw l${lvl}">${ic('alert')}${c}</span>` : ''}</button>`; }).join('')}</div>`;
}

function wrapText(t, max, maxLines){
  const words = String(t || '').split(/\s+/).filter(Boolean), lines = []; let cur = '';

  if (cur) lines.push(cur);
  const cut = s => s.length > max ? s.slice(0, max - 1) + '…' : s;
  const res = lines.slice(0, maxLines).map(cut);
  if (lines.length > maxLines && res.length) res[res.length - 1] = cut(res[res.length - 1].replace(/…$/, '') + '…');
  return res;
}

let lastTick = now(), liveSig = '';
function liveSigOf(t){
  const r = room(), lim = S().wcLimit * 60000, ea = exitAt(r.exam);
  return [examPhase(r.exam, t), ea ? (t >= ea ? 'E' : 'e') : '', r.wc.out.filter(o => t - o.since >= lim).map(o => o.seatId).join(',')].join('|');
}
function tick(){
  const t = now(), prev = lastTick; lastTick = t;
  const multi = state.rooms.length > 1, set = S();
  for (const r of state.rooms){
    const ex = r.exam, pre = multi ? r.name + ': ' : '';
    if (examState(ex) === 'running'){
      const end = examEndAt(ex);
      for (const m of [30, 15, 5, 1]){ const th = end - m * 60000; if (prev < th && t >= th && t - th < 120000) alertMsg(`${pre}faltam ${plural(m, 'minuto', 'minutos')}`, 'exam', r, m <= 5); }
      if (prev < end && t >= end) alertMsg(`${pre}tempo esgotado!`, 'end', r, true);
      const ea = exitAt(ex); if (ea && prev < ea && t >= ea) alertMsg(`${pre}saída liberada — os alunos já podem entregar`, 'exit', r, false);
    }
    for (const o of r.wc.out){ const th = o.since + set.wcLimit * 60000; if (prev < th && t >= th){ const s = seatOf(o.seatId, r); alertMsg(`${pre}${s ? who(s) : 'Aluno'} está há mais de ${set.wcLimit} min no banheiro`, 'wc', r, true); } }
  }
  $$('.live[data-since]').forEach(el => { el.textContent = dur(t - +el.dataset.since); });
  const sig = liveSigOf(t);
  if (sig !== liveSig){ liveSig = sig; render(); } else updateExamLive(t);
  if (telaoOn) renderTelao();
}
function updateExamLive(t){
  const ex = room().exam; if (examState(ex) !== 'running') return;
  const rem = examEndAt(ex) - t, tot = (ex.duration + ex.extra) * 60000, p = clamp(1 - rem / tot, 0, 1) * 100;
  $$('.exam-live').forEach(el => { el.textContent = rem > 0 ? dur(rem) : (el.closest('.exam-big') ? dur(-rem) : '+' + dur(-rem)); });
  $$('.stat.exam.run').forEach(el => el.style.setProperty('--p', p.toFixed(2) + '%'));
  $$('.exam-bar').forEach(el => { el.style.width = p + '%'; });
}
function alertMsg(text, kind, r, strong){
  const acts = [];

  if (kind === 'end') acts.push({label:'Encerrar', fn:() => { if (r.id !== state.active) switchRoom(r.id); examEnd(); }});
  if (kind === 'wc') acts.push({label:'Banheiro', fn:() => { if (r.id !== state.active) switchRoom(r.id); openSheet('wc'); }});
  acts.push({label:'OK', fn:() => {}});
  toast(text, {key:`alert-${kind}-${r.id}`, icon:kind === 'wc' ? 'door' : kind === 'exit' ? 'check' : 'bell', tone:'alert' + (strong ? ' red' : ''), ms:kind === 'end' ? 30000 : 12000, actions:acts});

let actx = null;
function audio(){ try { if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === 'suspended') actx.resume(); return actx; } catch (_) { return null; } }
function unlockAudio(){ if (S().sound) audio(); }
function beep(kind){
  if (!S().sound) return; const ac = audio(); if (!ac) return;
  const seq = {exam:[880, 1175], end:[1175, 880, 1175, 880], exit:[660, 880], wc:[740, 740], limit:[523, 440]}[kind] || [880];
  const t0 = ac.currentTime + .03;
  seq.forEach((f, i) => { const o = ac.createOscillator(), gn = ac.createGain(), st = t0 + i * .2; o.type = 'sine'; o.frequency.value = f; gn.gain.setValueAtTime(.0001, st); gn.gain.exponentialRampToValueAtTime(.16, st + .02); gn.gain.exponentialRampToValueAtTime(.0001, st + .18); o.connect(gn).connect(ac.destination); o.start(st); o.stop(st + .2); });
}

async function syncWake(){

function toast(text, o = {}){

  el.className = 'toast ' + (o.tone || '');
  el.innerHTML = `${o.icon ? `<span class="t-ic">${ic(o.icon)}</span>` : ''}<span class="t-tx">${esc(text)}</span>${(o.actions || []).map((a, i) => `<button data-i="${i}">${esc(a.label)}</button>`).join('')}`;
  el._acts = o.actions || [];

  clearTimeout(el._t); el._t = setTimeout(() => dismissToast(el), o.ms || ((o.actions && o.actions.length) ? 4500 : 2300));

}

let dlgDone = null;

    const inp = $('#dlgIn', dlgEl);

    const click = i => { const b = buttons[i]; if (!b || b.v == null){ done(null); return; } done({v:b.v, text:inp ? inp.value.trim() : ''}); };
    dlgDone = done;

  });
}

  if (e.key === 'Enter' && e.target.matches('[data-in="q"]')){ const first = $('#qRes [data-act="goSeat"]'); if (first){ e.preventDefault(); first.click(); } }
});
fileIn.addEventListener('change', () => { const f = fileIn.files && fileIn.files[0]; if (f) importFile(f); fileIn.value = ''; });

document.addEventListener('keydown', e => {
  if (!dlgEl.hidden) return;
  const typing = e.target.closest && e.target.closest('input, textarea, select, [contenteditable="true"]');
  const mod = e.ctrlKey || e.metaKey, k = (e.key || '').toLowerCase();
  if (mod && k === 'z' && !typing){ e.preventDefault(); if (e.shiftKey) redo(); else undo(); return; }
  if (mod && k === 'y' && !typing){ e.preventDefault(); redo(); return; }
  if (mod && k === 'k'){ e.preventDefault(); openSheet('search'); return; }
  if (e.key === 'Escape'){
    if (telaoOn){ closeTelao(); return; }
    if (swapFrom){ cancelSwap(); return; }
    if (sheet){ closeSheet(); return; }
    if (app.classList.contains('focus')){ toggleFocus(); return; }
    return;
  }
  if (typing || mod || e.altKey || telaoOn) return;
  const mi = '123456'.indexOf(e.key);
  if (mi >= 0 && e.key.length === 1){ setMode(MODES[mi].id); return; }
  switch (k){
    case '/': e.preventDefault(); openSheet('search'); break;
    case 'f': fit(true); break;
    case '+': case '=': zoomAt(1.25, null, null, true); break;
    case '-': case '_': zoomAt(1 / 1.25, null, null, true); break;
    case 'r': toggleFlip(); break;
    case 'l': toggleLens(); break;
    case 'b': openSheet('wc'); break;
    case 'p': openSheet('exam'); break;
    case 't': openTelao(); break;
    case 'o': openSheet('log'); break;
    case 'a': openSheet('students'); break;
    case 'n': if (mode === 'edit') addSeat(); break;
    case '?': openSheet('shortcuts'); break;
  }
});

/* ============================================================
   CICLO DE VIDA
   ============================================================ */
let lastW = window.innerWidth, rsT = 0;
window.addEventListener('resize', () => {
  clearTimeout(rsT);
  rsT = setTimeout(() => { measure(); if (Math.abs(window.innerWidth - lastW) > 40){ lastW = window.innerWidth; fit(false); } }, 150);
});
document.addEventListener('visibilitychange', () => { if (document.hidden) flush(); else tick(); syncWake(); });
window.addEventListener('pagehide', flush);
window.addEventListener('beforeunload', flush);
window.addEventListener('storage', e => {
  if (e.key !== KEY || !e.newValue || e.newValue === lastWritten) return;
  try { state = normalize(JSON.parse(e.newValue)); lastWritten = e.newValue; render(); } catch (_) {}
});
try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme); } catch (_) {}

/* ============================================================
   INÍCIO
   ============================================================ */
const repStyle = document.createElement('style'); repStyle.textContent = REP_CSS; document.head.appendChild(repStyle);
applyTheme();
render();
measure(); fit(false);
requestAnimationFrame(() => { measure(); fit(false); });
liveSig = liveSigOf(now());
setInterval(tick, 1000);
if (migrated) flush();
if (!S().onboarded) setTimeout(() => openSheet('welcome'), 400);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { measure(); });

})();
</script>
